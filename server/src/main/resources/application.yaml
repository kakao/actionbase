management:
  info:
    git:
      mode: full
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  sql:
    init:
      mode: never

actionbase:
  tenant: ${AB_TENANT:ab-none}
  datastore:
    type: memory
  catalog:
    # Phase 1 of #247 — runs alongside kc.graph.metastoreReloadInterval
    # until the v3 engine takes over the query path.
    reload-initial-delay: 0s
    reload-interval: 1m

kc:
  graph:
    metastoreReloadInterval: 1m
    metastore-reload-initial-delay: 0s

    use-token: false

    warm-up:
      enabled: false

    allow-mirror: false
