management:
  info:
    git:
      mode: full
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  sql:
    init:
      mode: never

actionbase:
  tenant: ${AB_TENANT:ab-none}
  # DATA or CONTROL, exclusive surfaces. Do not enable kc.graph.warmup on CONTROL - it calls the
  # data plane it is refused.
  role: ${AB_ROLE:DATA}
  datastore:
    type: memory

kc:
  graph:
    metastoreReloadInterval: 1m
    metastore-reload-initial-delay: 0s

    use-token: false

    warm-up:
      enabled: false

    allow-mirror: false

    # Defaults to true (HBase + MySQL mirrored). Set explicitly to false to disable the MySQL metastore (HBase-only mode).
    # use-jdbc-metastore: false
