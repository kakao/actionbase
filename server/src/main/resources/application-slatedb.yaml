# SlateDB storage profile
# Usage: --spring.profiles.active=slatedb
#
# Native library is bundled in the slatedb JAR (loaded automatically from classpath).

actionbase:
  tenant: ab-slatedb

kc:
  graph:
    defaultStorage:
      type: SLATEDB
      conf:
        path: data
        url: file://${SLATEDB_STORAGE_PATH:/tmp/actionbase-slatedb}
