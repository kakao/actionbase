- name: Create database
  description: Create likes database
  command: |
    create database
    --name likes
    --data '{
      "comment": "likes database"
    }'

- name: Create table
  description: Create likes table with schema
  command: |
    create table
    --database likes
    --name likes
    --data '{
      "desc": "Like",
      "type": "INDEXED",
      "schema": {
        "src": {
          "type": "STRING",
          "desc": "userId"
        },
        "tgt": {
          "type": "STRING",
          "desc": "targetId"
        },
        "fields": [
          {
            "name": "created_at",
            "type": "LONG",
            "desc": "created_at",
            "nullable": false
          }
        ]
      },
      "dirType": "BOTH",
      "indices": [
        {
          "name": "created_at_desc",
          "fields": [
            {
              "name": "created_at",
              "order": "DESC"
            }
          ],
          "desc": "order by created_at"
        }
      ],
      "storage": "datastore://likes/likes",
      "event": false,
      "readOnly": false,
      "mode": "SYNC"
    }'

- name: Insert edges
  description: Insert 3 edges with metadata
  command: |
    create edges
    --database likes
    --table likes
    --data '{
      "mutations": [
        {
          "type": "INSERT",
          "edge": {
            "version": __CURRENT_TIMESTAMP__,
            "source": "Alice",
            "target": "Phone",
            "properties": {
              "created_at": __CURRENT_TIMESTAMP__
            }
          }
        },
        {
          "type": "INSERT",
          "edge": {
            "version": __CURRENT_TIMESTAMP__,
            "source": "Alice",
            "target": "Laptop",
            "properties": {
              "created_at": __CURRENT_TIMESTAMP__
            }
          }
        },
        {
          "type": "INSERT",
          "edge": {
            "version": __CURRENT_TIMESTAMP__,
            "source": "Bob",
            "target": "Phone",
            "properties": {
              "created_at": __CURRENT_TIMESTAMP__
            }
          }
        }
      ]
    }'
