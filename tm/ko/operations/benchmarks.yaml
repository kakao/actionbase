- source: Performance benchmarks and metrics for Actionbase
  target: Actionbase의 성능 벤치마크 및 지표
  context: frontmatter:description
- source: Performance benchmarks for Actionbase.
  target: Actionbase의 성능 벤치마크
  context: paragraph
- source: Production Infrastructure
  target: 프로덕션 인프라
  context: heading
- source: 'Actionbase runs as stateless services that can scale horizontally:'
  target: 'Actionbase는 수평 확장이 가능한 무상태 서비스로 동작합니다:'
  context: paragraph
- source: '**Ingress** (Actionbase): 9 nodes (6 cores, 12GB RAM) — API gateway, request routing'
  target: '**Ingress**(Actionbase): 9개 노드(6코어, 12GB RAM) — API 게이트웨이, 요청 라우팅'
  context: list_item
- source: '**Worker** (Actionbase): 9 nodes (40 cores, 64GB RAM) — mutation processing, query execution'
  target: '**Worker**(Actionbase): 9개 노드(40코어, 64GB RAM) — 뮤테이션 처리, 쿼리 실행'
  context: list_item
- source: '**HBase**: 9 region servers (20 cores, 64GB RAM each) — storage backend'
  target: '**HBase**: 9개 리전 서버(20코어, 각 64GB RAM) — 스토리지 백엔드'
  context: list_item
- source: 'Ingress and Worker are Actionbase deployments. They maintain no local state—all data resides in the storage backend (HBase). This stateless architecture enables:'
  target: 'Ingress와 Worker는 Actionbase 배포입니다. 이들은 로컬 상태를 유지하지 않으며, 모든 데이터는 스토리지 백엔드(HBase)에 저장됩니다. 이러한 무상태 아키텍처는 다음과 같은 이점을 제공합니다:'
  context: paragraph
- source: '**Horizontal scaling**: Add nodes without data migration'
  target: '**수평 확장**: 데이터 마이그레이션 없이 노드를 추가할 수 있음'
  context: list_item
- source: '**Rolling updates**: Deploy without downtime'
  target: '**롤링 업데이트**: 다운타임 없이 배포 가능'
  context: list_item
- source: '**Failure recovery**: Any node can handle any request'
  target: '**장애 복구**: 어떤 노드든 모든 요청을 처리할 수 있음'
  context: list_item
- source: Production Traffic
  target: 프로덕션 트래픽
  context: heading
- source: 'Current peak: ~33k RPS (2M RPM). Typical workload: ~15% write, ~85% read.'
  target: '현재 피크: ~33,000 RPS(2,000,000 RPM). 일반적인 워크로드: 쓰기 ~15%, 읽기 ~85%'
  context: paragraph
- source: '**Latency**: Read ~5ms, Write ~20ms'
  target: '**지연 시간**: 읽기 ~5ms, 쓰기 ~20ms'
  context: list_item
- source: Capacity
  target: 용량
  context: heading
- source: 60k+ RPS in internal testing.
  target: 내부 테스트에서 60,000+ RPS 달성
  context: paragraph
