- source: When multiple source or target IDs are specified, the operation behaves as **mget** to retrieve multiple edges. In this case, a maximum of **25 edges** can be retrieved per API request. To retrieve more edges, make multiple API requests.
  target: 여러 소스 또는 타겟 ID를 지정하면 **mget**으로 동작하여 여러 엣지를 조회합니다. 이 경우 API 요청당 최대 **25개의 엣지**를 조회할 수 있습니다. 더 많은 엣지를 조회하려면 여러 API 요청을 보내세요.
  context: paragraph
