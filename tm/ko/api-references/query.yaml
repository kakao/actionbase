- source: Index Ranges
  target: 인덱스 범위
  context: heading
- source: The `ranges` parameter allows you to specify the data scan range in count/scan queries.
  target: '`ranges` 파라미터를 사용하면 count/scan 쿼리에서 데이터 스캔 범위를 지정할 수 있습니다.'
  context: paragraph
- source: Relationship between Ranges and Indexes
  target: 범위와 인덱스의 관계
  context: heading
- source: '**Important:** Ranges can only use fields that are included in the index.'
  target: '**중요:** 범위는 인덱스에 포함된 필드만 사용할 수 있습니다.'
  context: blockquote
- source: '**Index Dependency:** Fields used in `ranges` must have an index. Attempting to specify a range on a field without an index will return unexpected results.'
  target: '**인덱스 의존성:** `ranges`에 사용되는 필드는 인덱스가 있어야 합니다. 인덱스가 없는 필드에 범위를 지정하면 예상치 못한 결과가 반환됩니다.'
  context: list_item
- source: '**Operator Meaning:** The `eq`, `gt(e)`, `lt(e)`, and `between` operators determine the start and end points of the actual storage scan. They must be used appropriately according to index properties.'
  target: '**연산자 의미:** `eq`, `gt(e)`, `lt(e)`, `between` 연산자는 실제 스토리지 스캔의 시작점과 끝점을 결정합니다. 인덱스 속성에 맞게 적절히 사용해야 합니다.'
  context: list_item
- source: 'When an index is set to `DESC` (descending): `lt` becomes the start point and `gt` becomes the end point.'
  target: '인덱스가 `DESC` (내림차순)으로 설정된 경우: `lt`가 시작점, `gt`가 끝점이 됩니다.'
  context: list_item
- source: 'When an index is set to `ASC` (ascending): `gt` becomes the start point and `lt` becomes the end point.'
  target: '인덱스가 `ASC` (오름차순)으로 설정된 경우: `gt`가 시작점, `lt`가 끝점이 됩니다.'
  context: list_item
- source: '**Composite Ranges:** Ranges can be used in the order of the field combination that the index is defined on. Ranges must be applied in the order of fields defined in the index.'
  target: '**복합 범위:** 범위는 인덱스가 정의된 필드 조합의 순서대로 사용할 수 있습니다. 범위는 인덱스에 정의된 필드 순서대로 적용해야 합니다.'
  context: list_item
- source: Range Syntax
  target: 범위 구문
  context: heading
- source: 'Ranges are written in the following format:'
  target: '범위는 다음 형식으로 작성합니다:'
  context: paragraph
- source: 'Each range follows this format:'
  target: '각 범위는 다음 형식을 따릅니다:'
  context: paragraph
- source: 'To apply multiple ranges, separate them with semicolons (`;`):'
  target: '여러 범위를 적용하려면 세미콜론(`;`)으로 구분합니다:'
  context: paragraph
- source: 'When using the `in` or `bt` (between) operator, multiple values are separated by commas (`,`):'
  target: '`in` 또는 `bt` (between) 연산자를 사용할 때 여러 값은 쉼표(`,`)로 구분합니다:'
  context: paragraph
