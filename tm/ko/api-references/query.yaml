- source: '**Simple range:**'
  target: '**단순 범위:**'
  context: paragraph
- source: This example specifies a range to retrieve only edges where the `type` property is 0. Note that `type` refers to `properties.type`, and `properties.type` must be included in `your_index`.
  target: 이 예시는 `type` 프로퍼티가 0인 엣지만 조회하는 범위를 지정합니다. `type`은 `properties.type`을 의미하며, `properties.type`이 `your_index`에 포함되어 있어야 합니다.
  context: paragraph
- source: '**Composite range:**'
  target: '**복합 범위:**'
  context: paragraph
- source: This example specifies a range to retrieve only edges where `type` is 0 and `createdAt` is greater than 1000000.
  target: 이 예시는 `type`이 0이고 `createdAt`이 1000000보다 큰 엣지만 조회하는 범위를 지정합니다.
  context: paragraph
- source: '**Between operator:**'
  target: '**Between 연산자:**'
  context: paragraph
- source: This example specifies a range to retrieve only edges where `createdAt` is between 1000000 and 2000000.
  target: 이 예시는 `createdAt`이 1000000에서 2000000 사이인 엣지만 조회하는 범위를 지정합니다.
  context: paragraph
- source: Filters
  target: 필터
  context: heading
- source: The `filters` parameter allows you to filter data (edges) in get/scan queries. It uses the same format as [ranges](#index-ranges).
  target: '`filters` 파라미터를 사용하면 get/scan 쿼리에서 데이터(엣지)를 필터링할 수 있습니다. [범위](#index-ranges)와 동일한 형식을 사용합니다.'
  context: paragraph
- source: '**Difference from ranges:** While [ranges](#index-ranges) pre-specifies the query range and can only use fields set as indexes, `filters` filters the query results and can use fields that are not set as indexes.'
  target: '**범위와의 차이점:** [범위](#index-ranges)는 쿼리 범위를 사전에 지정하며 인덱스로 설정된 필드만 사용할 수 있는 반면, `filters`는 쿼리 결과를 필터링하며 인덱스로 설정되지 않은 필드도 사용할 수 있습니다.'
  context: paragraph
