- source: '`lte` | Less than or equal | `createdAt:lte:2000000`'
  target: '`lte` | 이하 | `createdAt:lte:2000000`'
  context: table
- source: '`bt` | Between two values | `createdAt:bt:1000000,2000000`'
  target: '`bt` | 두 값 사이 | `createdAt:bt:1000000,2000000`'
  context: table
