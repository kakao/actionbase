- source: The `offset` parameter indicates the starting position of the next page, and `hasNext` indicates whether there is a next page. If there is no offset, the first page is returned.
  target: '`offset` 파라미터는 다음 페이지의 시작 위치를 나타내고, `hasNext`는 다음 페이지가 있는지를 나타냅니다. 오프셋이 없으면 첫 번째 페이지가 반환됩니다.'
  context: paragraph
- source: 1. First Page Request
  target: 1. 첫 번째 페이지 요청
  context: heading
- source: Request the first page without an offset.
  target: 오프셋 없이 첫 번째 페이지를 요청합니다.
