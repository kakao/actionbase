- source: '**Note:** When `total` is -1, the total count is not calculated. If `features=total` is provided, the total is actually calculated.'
  target: '**참고:** `total`이 -1이면 전체 개수가 계산되지 않은 것입니다. `features=total`을 제공하면 전체 개수가 실제로 계산됩니다.'
  context: paragraph
