- source: '`gte` | Greater than or equal | `createdAt:gte:1000000`'
  target: '`gte` | 이상 | `createdAt:gte:1000000`'
  context: table
- source: '`lt` | Less than | `createdAt:lt:2000000`'
  target: '`lt` | 미만 | `createdAt:lt:2000000`'
