- source: 1. Edge Mutation
  target: 1. 엣지 뮤테이션
  context: heading
- source: Mutate edges between source nodes and target nodes.
  target: 소스 노드와 타겟 노드 사이의 엣지를 변경합니다.
  context: paragraph
