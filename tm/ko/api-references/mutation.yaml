- source: 2. Edge Mutation (Sync)
  target: 2. 엣지 뮤테이션 (동기)
  context: heading
- source: Mutate edges synchronously. This endpoint waits for the mutation to complete before returning a response.
  target: 엣지를 동기적으로 변경합니다. 이 엔드포인트는 뮤테이션이 완료될 때까지 기다린 후 응답을 반환합니다.
  context: paragraph
- source: 3. Multi-Edge Mutation
  target: 3. 멀티 엣지 뮤테이션
  context: heading
- source: Mutate multi-edges identified by edge IDs.
  target: 엣지 ID로 식별되는 멀티 엣지를 변경합니다.
  context: paragraph
- source: '[MultiEdgeBulkMutationRequest](#multiedgebulkmutationrequest) - Payload containing mutation items'
  target: '[MultiEdgeBulkMutationRequest](#multiedgebulkmutationrequest) - 뮤테이션 항목을 포함한 페이로드'
  context: paragraph
- source: '[MultiEdgeMutationResponse](#multiedgemutationresponse) - Payload containing mutation results'
  target: '[MultiEdgeMutationResponse](#multiedgemutationresponse) - 뮤테이션 결과를 포함한 페이로드'
  context: paragraph
- source: 4. Multi-Edge Mutation (Sync)
  target: 4. 멀티 엣지 뮤테이션 (동기)
  context: heading
- source: Mutate multi-edges synchronously. This endpoint waits for the mutation to complete before returning a response.
  target: 멀티 엣지를 동기적으로 변경합니다. 이 엔드포인트는 뮤테이션이 완료될 때까지 기다린 후 응답을 반환합니다.
  context: paragraph
- source: Event Types
  target: 이벤트 타입
  context: heading
- source: 'The `type` field in mutation items specifies the operation to perform:'
  target: '뮤테이션 항목의 `type` 필드는 수행할 작업을 지정합니다:'
  context: paragraph
- source: Type | Description
  target: 타입 | 설명
  context: table
- source: '`INSERT` | Create a new edge or update an existing edge with a new version'
  target: '`INSERT` | 새 엣지를 생성하거나 기존 엣지를 새 버전으로 업데이트합니다'
  context: table
- source: '`UPDATE` | Update properties of an existing edge'
  target: '`UPDATE` | 기존 엣지의 프로퍼티를 업데이트합니다'
  context: table
- source: '`DELETE` | Delete an edge (marks it as deleted)'
  target: '`DELETE` | 엣지를 삭제합니다 (삭제됨으로 표시)'
  context: table
- source: Lock Parameter
  target: 락 파라미터
  context: heading
- source: 'The `lock` parameter controls whether to acquire a lock during mutation:'
  target: '`lock` 파라미터는 뮤테이션 중 락 획득 여부를 제어합니다:'
  context: paragraph
- source: '**true (default)**: Acquires a lock to prevent concurrent modifications. Ensures data consistency but may have higher latency.'
  target: '**true (기본값)**: 동시 수정을 방지하기 위해 락을 획득합니다. 데이터 일관성을 보장하지만 지연 시간이 높아질 수 있습니다.'
  context: list_item
- source: '**false**: Skips locking. Faster but may lead to race conditions if multiple mutations target the same edge simultaneously.'
  target: '**false**: 락을 건너뜁니다. 더 빠르지만 여러 뮤테이션이 동시에 같은 엣지를 대상으로 할 경우 경쟁 조건이 발생할 수 있습니다.'
  context: list_item
- source: '**Note:** It is recommended to use `lock=true` in production environments to ensure data consistency.'
  target: '**참고:** 데이터 일관성을 보장하기 위해 프로덕션 환경에서는 `lock=true`를 사용하는 것이 권장됩니다.'
  context: paragraph
