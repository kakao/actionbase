- source: Actionbase REST API reference
  target: Actionbase REST API 레퍼런스
  context: frontmatter:description
- source: Actionbase provides REST APIs for metadata management, mutations, and queries.
  target: Actionbase는 메타데이터 관리, 뮤테이션, 쿼리를 위한 REST API를 제공합니다.
  context: paragraph
- source: 'Local: `http://localhost:8080`'
  target: '로컬: `http://localhost:8080`'
  context: list_item
- source: 'Deployed: your server URL (e.g., `http://ab.example.com`)'
  target: '배포 환경: 서버 URL (예: `http://ab.example.com`)'
  context: list_item
- source: Authentication
  target: 인증
  context: heading
- source: Internally, Actionbase uses a custom authentication system. We abstracted it via `CustomTokenFilter` interface, but weren't confident the implementation was ready for public release due to security considerations. Given the time available, we focused on documentation and developer experience, leaving the interface without a default implementation. The `Authorization` header is accepted but not validated—any value works, or omit it entirely.
  target: 내부적으로 Actionbase는 자체 인증 시스템을 사용합니다. `CustomTokenFilter` 인터페이스를 통해 추상화했지만, 보안 고려 사항으로 인해 공개 릴리스에 적합한 수준인지 확신할 수 없었습니다. 주어진 시간 내에 문서화와 개발자 경험에 집중하여, 기본 구현 없이 인터페이스만 남겨두었습니다. `Authorization` 헤더는 수신되지만 검증되지 않습니다—어떤 값이든 사용할 수 있으며, 생략해도 됩니다.
  context: paragraph
- source: As we continue documenting production operations, we plan to provide authentication support as well.
  target: 프로덕션 운영 문서화를 계속 진행하면서, 인증 지원도 함께 제공할 계획입니다.
  context: paragraph
