- source: This document describes how Actionbase encodes and stores data internally. This information is primarily for contributors and those who need to understand the low-level storage format.
  target: 이 문서는 Actionbase가 내부적으로 데이터를 인코딩하고 저장하는 방법을 설명합니다. 이 정보는 주로 기여자와 저수준 저장 포맷을 이해해야 하는 사용자를 위한 것입니다.
  context: paragraph
- source: For high-level concepts, see [Core Concepts](/design/concepts/).
  target: 고수준 개념은 [핵심 개념](/ko/design/concepts/)을 참조하세요.
  context: paragraph
- source: Row Types
  target: 행 타입
  context: heading
- source: Actionbase stores edge data using multiple row types in the storage backend. Each row type serves a specific query purpose.
  target: Actionbase는 스토리지 백엔드에서 여러 행 타입을 사용하여 엣지 데이터를 저장합니다. 각 행 타입은 특정 쿼리 목적에 맞게 설계되었습니다.
  context: paragraph
