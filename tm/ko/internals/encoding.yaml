- source: Stores index entries for Scan queries. Uses **Narrow Row** format for high-cardinality indexes.
  target: Scan 쿼리의 인덱스 엔트리를 저장합니다. 고카디널리티 인덱스를 위해 **내로우 로우** 포맷을 사용합니다.
  context: paragraph
