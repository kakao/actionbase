- source: Friends (CQRS)
  target: 친구관계 (CQRS)
  context: frontmatter:title
- source: Adding Actionbase as a flexible query layer for friend relationships
  target: 친구 관계를 위한 유연한 쿼리 계층으로 Actionbase를 추가
  context: frontmatter:description
- source: 'This story demonstrates the **CQRS (Command Query Responsibility Segregation)** pattern: how Actionbase became a read-optimized view layer for KakaoTalk''s friend relationships.'
  target: '이 사례는 **CQRS(명령 쿼리 책임 분리)** 패턴을 보여줍니다: Actionbase가 카카오톡 친구 관계의 읽기 최적화 뷰 계층으로 어떻게 활용되었는지 설명합니다.'
  context: paragraph
- source: 'Friend relationships in KakaoTalk are stored across dozens of sharded MySQL databases. To serve read-heavy queries, an HBase-based view layer was already in place:'
  target: '카카오톡의 친구 관계는 수십 개의 샤딩된 MySQL 데이터베이스에 분산 저장되어 있습니다. 읽기 중심의 쿼리를 처리하기 위해 이미 HBase 기반 뷰 계층이 구축되어 있었습니다:'
  context: paragraph
- source: 'This worked for the original use case. But as requirements evolved, limitations emerged:'
  target: '기존에는 이 구조가 목적에 맞게 잘 동작했습니다. 하지만 요구사항이 진화하면서 다음과 같은 한계가 드러났습니다:'
  context: paragraph
- source: We added Actionbase—not as a replacement, but as an additional view layer.
  target: Actionbase를 대체가 아닌 추가 뷰 계층으로 도입했습니다.
  context: paragraph
- source: The HBase view was designed for a specific access pattern
  target: HBase 뷰는 특정 접근 패턴에 맞춰 설계됨
  context: list_item
- source: Limited flexibility for new query types and schema changes
  target: 새로운 쿼리 유형과 스키마 변경에 대한 유연성 부족
  context: list_item
- source: 'Rather than replacing the existing system, we added Actionbase alongside it:'
  target: '기존 시스템을 대체하지 않고, Actionbase를 함께 추가했습니다:'
  context: paragraph
- source: 'The key insight: Actionbase doesn''t need to be the source of truth. It can serve as a flexible view, consuming changes via CDC. The existing system (MySQL + HBase) remained unchanged.'
  target: '핵심 인사이트: Actionbase는 진실의 원천(source of truth)이 될 필요가 없습니다. CDC를 통해 변경 사항을 소비하는 유연한 뷰 계층으로 동작할 수 있습니다. 기존 시스템(MySQL + HBase)은 변경되지 않았습니다.'
  context: paragraph
- source: '**Actionbase works as a CQRS view.** It doesn''t have to own the data to add value.'
  target: '**Actionbase는 CQRS 뷰로 작동합니다.** 데이터에 대한 소유권을 가지지 않아도 가치를 더할 수 있습니다.'
  context: list_item
- source: '**Source DB CDC enables non-invasive integration.** No changes to the write path required.'
  target: '**CDC를 통해 비침습적 통합이 가능합니다.** 쓰기 경로에 변경이 필요하지 않았습니다.'
  context: list_item
- source: '**Schema flexibility unlocks new use cases.** Get, scan, count, reverse—all from a single schema definition.'
  target: '**스키마의 유연성으로 새로운 사용 사례가 열립니다.** 단일 스키마 정의만으로 get, scan, count, reverse가 모두 가능합니다.'
  context: list_item
- source: This pattern opened the door to adding Actionbase alongside existing systems without migration risk.
  target: 이 패턴을 통해 마이그레이션 위험 없이 기존 시스템과 함께 Actionbase를 추가할 수 있는 길이 열렸습니다.
  context: paragraph
- source: First, we set up the data flow. Debezium captured changes from MySQL shards and published them to Kafka. Actionbase consumed these events and applied mutations.
  target: 먼저 데이터 흐름을 구축했습니다. Debezium이 MySQL 샤드의 변경 사항을 캡처해 Kafka로 발행하면, Actionbase가 이 이벤트를 소비하고 뮤테이션을 적용합니다.
  context: paragraph
- source: 'For historical data, we:'
  target: '과거 데이터를 위해 다음과 같은 절차를 진행했습니다:'
  context: paragraph
- source: This gave us a consistent snapshot without downtime.
  target: 이로 인해 다운타임 없이 일관된 스냅샷을 얻을 수 있었습니다.
  context: paragraph
- source: Dumped the MySQL tables
  target: MySQL 테이블을 덤프
  context: list_item
- source: Bulk-loaded into Actionbase
  target: Actionbase에 대량 적재
  context: list_item
- source: Replayed the WAL to catch up with changes during the dump
  target: 덤프 중 발생한 변경 사항을 따라잡기 위해 WAL을 재생
  context: list_item
- source: '**Note:** The migration pipeline (bulk loading) is currently internal. Open source release is in progress — see [Roadmap](/community/roadmap/).'
  target: '**참고:** 마이그레이션 파이프라인(대량 적재)은 현재 내부적으로만 운영 중입니다. 오픈소스 공개는 진행 중이며, [로드맵](/ko/community/roadmap/)을 참고하세요.'
  context: blockquote
- source: With Actionbase in place, new systems used it for all query types—get, scan, count, and reverse—through a single schema definition.
  target: Actionbase가 도입되면서 새로운 시스템들은 모든 쿼리 유형(get, scan, count, reverse)을 단일 스키마 정의를 통해 Actionbase에 요청했습니다.
  context: paragraph
