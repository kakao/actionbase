- source: Gift - Recent Views (Async)
  target: 선물하기 최근 본 조회 (비동기)
  context: frontmatter:title
- source: Async processing for high-frequency interactions
  target: 고빈도 인터랙션을 위한 비동기 처리
  context: frontmatter:description
- source: 'This story demonstrates the **Asynchronous Processing** pattern: how Actionbase handled high-frequency writes for KakaoTalk Gift''s recent views.'
  target: '이 사례에서는 **비동기 처리** 패턴을 소개합니다: Actionbase가 카카오톡 선물하기의 최근 본 조회에 대해 어떻게 고빈도 쓰기를 처리했는지 보여줍니다.'
  context: paragraph
- source: Recent views are different from other interactions. Every time a user browses a product, a view event is generated. The write volume is significantly higher than likes or wishes.
  target: 최근 본 조회는 다른 인터랙션과 다릅니다. 사용자가 상품을 볼 때마다 조회 이벤트가 생성되며, 쓰기량이 좋아요나 찜보다 훨씬 많습니다.
  context: paragraph
- source: 'Processing these writes synchronously in the user-facing request path would:'
  target: '이러한 쓰기를 사용자-facing 요청 경로에서 동기적으로 처리하면 다음과 같은 문제가 발생합니다:'
  context: paragraph
- source: Actionbase needed a pattern that could absorb high write throughput without affecting user experience.
  target: Actionbase는 사용자 경험에 영향을 주지 않으면서 높은 쓰기 처리량을 흡수할 수 있는 패턴이 필요했습니다.
  context: paragraph
- source: Increase response latency
  target: 응답 지연 시간 증가
  context: list_item
- source: Create backpressure during traffic spikes
  target: 트래픽 급증 시 백프레셔 발생
  context: list_item
- source: Risk service degradation under load
  target: 부하 상황에서 서비스 품질 저하 위험
  context: list_item
- source: 'Rather than processing mutations synchronously, we used async processing:'
  target: '뮤테이션을 동기적으로 처리하는 대신 비동기 처리를 사용했습니다:'
  context: paragraph
- source: 'The key insight: separate the acknowledgment from the processing. The user gets an immediate response while the actual mutation happens in the background.'
  target: 핵심 인사이트는 확인(acknowledgment)과 처리를 분리하는 데 있습니다. 사용자는 즉시 응답을 받고, 실제 뮤테이션은 백그라운드에서 처리됩니다.
  context: paragraph
- source: '**Async processing handles write spikes gracefully.** The WAL absorbs bursts; the processor drains at a sustainable rate.'
  target: '**비동기 처리는 쓰기 급증을 부드럽게 처리합니다.** WAL이 버스트를 흡수하고, 프로세서가 지속 가능한 속도로 데이터를 처리합니다.'
  context: list_item
- source: '**Immediate response improves user experience.** Users don''t wait for the full mutation cycle.'
  target: '**즉시 응답이 사용자 경험을 향상시킵니다.** 사용자는 전체 뮤테이션 주기를 기다릴 필요가 없습니다.'
  context: list_item
- source: '**Eventual consistency is acceptable for some use cases.** Recent views don''t need real-time accuracy—tens of milliseconds delay is fine.'
  target: '**최종 일관성은 일부 사용 사례에 적합합니다.** 최근 본 조회는 실시간 정확성이 필요하지 않으며, 수십 밀리초의 지연은 허용됩니다.'
  context: list_item
- source: This pattern became the template for high-frequency interactions at Kakao.
  target: 이 패턴은 카카오에서 고빈도 상호작용의 템플릿이 되었습니다.
  context: paragraph
- source: First, when a view event arrives, Actionbase writes it to WAL with `queue=true` and returns immediately. No locking, no state computation—just append to the log.
  target: 먼저 조회 이벤트가 도착하면 Actionbase는 `queue=true`로 WAL에 기록하고 즉시 반환합니다. 락도 없고 상태 계산도 없으며, 단순히 로그에 추가합니다.
  context: paragraph
- source: 'Next, a Spark Streaming job consumes the WAL entries and sends mutations back to Actionbase. The processor:'
  target: '다음으로 Spark Streaming 작업이 WAL 엔트리를 소비하여 Actionbase로 뮤테이션을 다시 전송합니다. 프로세서는 다음과 같은 작업을 수행합니다:'
  context: paragraph
- source: Batches events for efficiency
  target: 효율성을 위해 이벤트를 배치 처리
  context: list_item
- source: Throttles during traffic spikes
  target: 트래픽 급증 시 쓰로틀링 적용
  context: list_item
- source: Retries on transient failures
  target: 일시적 실패 시 재시도 수행
  context: list_item
- source: '**Note:** The async processor is currently internal. Open source release is in progress — see [Roadmap](/community/roadmap/).'
  target: '**참고:** 비동기 프로세서는 현재 내부적으로만 사용됩니다. 오픈 소스 릴리스는 진행 중이며, [로드맵](/ko/community/roadmap/)을 참고하세요.'
  context: blockquote
- source: Finally, Actionbase processes the mutations in the background—acquiring locks, updating state, computing indexes and counts. Data is typically reflected within tens of milliseconds.
  target: 마지막으로, Actionbase가 백그라운드에서 뮤테이션을 처리합니다. 락을 획득하고, 상태를 업데이트하며, 인덱스와 카운트를 계산합니다. 데이터는 일반적으로 수십 밀리초 이내에 반영됩니다.
  context: paragraph
