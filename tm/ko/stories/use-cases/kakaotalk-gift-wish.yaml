- source: Migrating KakaoTalk Gift's wish list from MySQL to Actionbase
  target: 카카오톡 선물하기의 위시를 MySQL에서 Actionbase로 마이그레이션
  context: frontmatter:description
- source: 'This story demonstrates the **SSOT (Single Source of Truth)** pattern: how KakaoTalk Gift''s wish list became Actionbase''s first production deployment.'
  target: '이 사례는 **SSOT(단일 소스 오브 트루스) 패턴**을 보여줍니다: 카카오톡 선물하기의 위시가 Actionbase의 첫 프로덕션 배포가 된 과정을 설명합니다.'
  context: paragraph
- source: 'The wish list feature in KakaoTalk Gift allowed users to save gifts they wanted to receive. The existing architecture looked like this:'
  target: '카카오톡 선물하기의 위시는 사용자가 받고 싶은 선물을 저장할 수 있게 했습니다. 기존 아키텍처는 다음과 같았습니다:'
  context: paragraph
- source: 'This worked well initially. But as traffic grew, we hit scaling walls:'
  target: '처음에는 잘 동작했지만, 트래픽이 증가하면서 다음과 같은 확장성 한계에 부딪혔습니다:'
  context: paragraph
- source: We considered sharding MySQL. But sharding brings its own complexity—shard key management, cross-shard queries, operational overhead. Actionbase got the chance to prove itself here.
  target: MySQL 샤딩을 고려했지만, 샤딩은 샤드 키 관리, 샤드 간 쿼리, 운영 부담 등 자체적인 복잡성을 가져옵니다. Actionbase가 이를 증명할 기회가 있었습니다.
  context: paragraph
- source: '**MySQL** stored the wish data and served forward queries (get, scan, count by user)'
  target: '**MySQL**이 위시 데이터를 저장하고 조회(조회, 스캔, 사용자별 카운트) 쿼리를 제공했습니다.'
  context: list_item
- source: '**Spring Batch** aggregated reverse counts (how many users wished each product)'
  target: '**Spring Batch**가 역방향 카운트(각 상품별 몇 명의 사용자가 위시했는지)를 집계했습니다.'
  context: list_item
- source: '**Redis** cached the reverse counts for fast reads'
  target: '**Redis**가 역방향 카운트를 캐시하여 빠른 읽기를 지원했습니다.'
  context: list_item
- source: Table size grew beyond comfortable limits
  target: 테이블 크기가 편안한 한계를 넘어 커졌습니다.
  context: list_item
- source: Keeping data consistent between MySQL and Redis became complex
  target: MySQL과 Redis 간 데이터 일관성 유지가 점점 복잡해졌습니다.
  context: list_item
- source: We didn't flip a switch. The migration happened in careful stages over several months.
  target: 스위치 한 번으로 전환하지 않았습니다. 마이그레이션은 수개월에 걸쳐 신중하게 단계적으로 진행되었습니다.
  context: paragraph
- source: '**Gradual migration reduces risk.** Dual write, then dual read, then cutover. Each stage validates the next.'
  target: '**점진적 마이그레이션은 리스크를 줄입니다.** 이중 쓰기, 그다음 이중 읽기, 마지막으로 전환. 각 단계에서 다음 단계를 검증합니다.'
  context: list_item
- source: '**Keep rollback paths open.** We maintained the existing system for months after the cutover. Peace of mind matters.'
  target: '**롤백 경로를 항상 열어두세요.** 전환 후에도 기존 시스템을 몇 달간 유지했습니다. 마음의 평화가 중요합니다.'
  context: list_item
- source: '**WAL replay enables zero-downtime bulk loads.** Dump, load, replay—no data loss.'
  target: '**WAL 재생을 통해 무중단 대량 적재가 가능합니다.** 덤프, 적재, 재생—데이터 손실 없이 진행됩니다.'
  context: list_item
- source: This pattern became the template for source-of-truth migrations at Kakao.
  target: 이 패턴이 카카오에서 진실의 원천 마이그레이션의 템플릿이 되었습니다.
  context: paragraph
- source: First, we added Actionbase as a write target alongside the existing system (MySQL + Redis). Reads still came from the existing system.
  target: 먼저 Actionbase를 기존 시스템(MySQL + Redis)과 함께 쓰기 대상으로 추가했습니다. 읽기는 여전히 기존 시스템에서 제공했습니다.
  context: paragraph
- source: 'For historical data, we:'
  target: '기존 데이터에 대해서는 다음과 같이 처리했습니다:'
  context: paragraph
- source: This gave us a consistent snapshot without downtime.
  target: 이로 인해 다운타임 없이 일관된 스냅샷을 확보할 수 있었습니다.
  context: paragraph
- source: Dumped the MySQL table
  target: MySQL 테이블을 덤프했습니다.
  context: list_item
- source: Bulk-loaded into Actionbase
  target: Actionbase에 대량 적재했습니다.
  context: list_item
- source: Replayed the WAL to catch up with writes that happened during the dump
  target: 덤프 도중 발생한 쓰기를 반영하기 위해 WAL을 재생했습니다.
  context: list_item
- source: '**Note:** The migration pipeline (bulk loading) is currently internal. Open source release is in progress — see [Roadmap](/community/roadmap/).'
  target: '**참고:** 마이그레이션 파이프라인(대량 적재)은 현재 내부적으로만 운영 중입니다. 오픈 소스 공개가 진행 중이며, 자세한 내용은 [로드맵](/ko/community/roadmap/)을 참고하세요.'
  context: blockquote
- source: 'For one month, we compared:'
  target: '한 달 동안 다음과 같이 비교했습니다:'
  context: paragraph
- source: The data matched. We had confidence in consistency.
  target: 데이터가 일치했습니다. 일관성에 대한 확신을 가질 수 있었습니다.
  context: paragraph
- source: MySQL dumps (source of truth)
  target: MySQL 덤프(진실의 원천)
  context: list_item
- source: Actionbase CDC-based snapshots
  target: Actionbase CDC 기반 스냅샷
  context: list_item
- source: Next, we added shadow reads to Actionbase—calling it but not using the results. This validated that Actionbase could handle production traffic patterns without affecting users.
  target: 다음으로, Actionbase에 그림자 읽기(shadow reads)를 추가했습니다. 즉, Actionbase를 호출하되 그 결과를 사용하지 않았습니다. 이로써 Actionbase가 사용자 영향 없이 실제 트래픽 패턴을 처리할 수 있는지 검증했습니다.
  context: paragraph
- source: After confirming traffic handling, we switched reads to Actionbase. At this point, Actionbase became the source of truth. The existing system remained as a backup—if anything went wrong, we could roll back instantly.
  target: 트래픽 처리가 확인된 후, 읽기를 Actionbase로 전환했습니다. 이 시점에서 Actionbase가 진실의 원천이 되었습니다. 기존 시스템은 백업으로 남아 있었고, 문제가 발생하면 즉시 롤백할 수 있었습니다.
  context: paragraph
- source: 'Months later, with no issues, we removed the old system entirely:'
  target: '몇 달 후, 문제가 전혀 발생하지 않아 기존 시스템을 완전히 제거했습니다:'
  context: paragraph
- source: No more batch jobs. No more consistency issues. Just Actionbase.
  target: 더 이상 배치 작업이 없습니다. 더 이상 일관성 문제도 없습니다. 이제 Actionbase만 남았습니다.
  context: paragraph
