- source: HBase Consistency
  target: HBase 정합성 검증
  context: frontmatter:title
- source: Periodically verifying and correcting consistency between State, Index, and Count
  target: State, Index, Count 간 정합성을 주기적으로 검증하고 보정
  context: frontmatter:description
- source: 'This story demonstrates the **Periodic Verification** pattern: how to detect and correct data inconsistencies that can occur during operations.'
  target: '이 스토리는 **주기적 검증** 패턴을 보여줍니다: 운영 중 발생할 수 있는 데이터 불일치를 감지하고 보정하는 방법입니다.'
  context: paragraph
- source: Deployed. Migration verified. But data inconsistencies can still occur during operations. There's no perfect atomicity in distributed systems.
  target: 배포했습니다. 마이그레이션도 검증했습니다. 하지만 운영 중에도 데이터 불일치가 발생할 수 있습니다. 분산 시스템에서 완벽한 원자성은 없습니다.
  context: paragraph
- source: 'Actionbase stores three types of data in HBase:'
  target: 'Actionbase는 HBase에 세 가지 데이터를 저장합니다:'
  context: paragraph
- source: A single mutation updates State, Index, and Count together.
  target: 하나의 뮤테이션이 State, Index, Count를 한 번에 갱신합니다.
  context: paragraph
- source: '**State**: Source of truth - actual edge records'
  target: '**State**: 원천 데이터 - 실제 엣지 레코드'
  context: list_item
- source: '**Index**: Derived data for queries'
  target: '**Index**: 쿼리를 위한 파생 데이터'
  context: list_item
- source: '**Count**: Aggregated data'
  target: '**Count**: 집계 데이터'
  context: list_item
- source: HBase batch operations are not atomic. If a region server fails mid-operation or network issues cause partial writes, only some may update.
  target: HBase 배치 오퍼레이션은 원자적이지 않습니다. 리전 서버가 중간에 실패하거나 네트워크 문제로 부분 쓰기가 발생하면, 일부만 갱신될 수 있습니다.
  context: paragraph
- source: If State updated but Index didn't? Queries return wrong results.
  target: State는 갱신됐는데 Index는 안 됐다면? 쿼리가 틀린 결과를 반환합니다.
  context: paragraph
- source: Verify periodically.
  target: 주기적으로 검증합니다.
  context: paragraph
- source: 'Export HBase snapshots and run verification jobs:'
  target: 'HBase 스냅샷을 익스포트해서 검증 작업을 돌립니다:'
  context: paragraph
- source: '**State vs Index**: Does every state have a corresponding index?'
  target: '**State vs Index**: 모든 state에 해당하는 index가 있는지'
  context: list_item
- source: '**State vs Count**: Does the aggregation match actual record count?'
  target: '**State vs Count**: 집계가 실제 레코드 수와 일치하는지'
  context: list_item
- source: When mismatch is detected, we correct it. State is the truth. Index and Count can be regenerated from State.
  target: 불일치가 감지되면 보정합니다. State가 정답입니다. Index와 Count는 State로부터 재생성할 수 있습니다.
  context: paragraph
- source: Correction frequency is determined by service SLA.
  target: 보정 주기는 서비스 SLA에 따라 결정합니다.
  context: paragraph
- source: '**Don''t expect perfect atomicity.** Partial failures happen in distributed systems. Mechanisms to detect and correct them are necessary.'
  target: '**완벽한 원자성을 기대하지 않는다.** 분산 시스템에서 부분 실패는 발생합니다. 이를 감지하고 보정하는 메커니즘이 필요합니다.'
  context: list_item
- source: '**State is the truth.** Design derived data (Index, Count) so it can always be regenerated from State.'
  target: '**State가 정답.** 파생 데이터(Index, Count)는 언제든 State로부터 재생성할 수 있도록 설계합니다.'
  context: list_item
