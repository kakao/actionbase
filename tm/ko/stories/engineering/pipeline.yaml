- source: Enabling analytics and operations through event streaming
  target: 이벤트 스트리밍을 통한 분석 및 운영 활성화
  context: frontmatter:description
- source: This story shares how Kakao uses Actionbase internally. We're preparing to open source these components — see [Roadmap](/community/roadmap/).
  target: 이 스토리에서는 카카오가 내부적으로 Actionbase를 어떻게 활용하는지 공유합니다. 이러한 컴포넌트들을 오픈 소스로 공개할 예정이니 [로드맵](/ko/community/roadmap/)을 참고하세요.
  context: blockquote
- source: 'This story demonstrates the **Integration Pipeline** pattern: how Actionbase satisfies downstream requirements without building them itself.'
  target: 이 스토리는 **통합 파이프라인** 패턴을 보여줍니다. Actionbase가 자체적으로 요구사항을 구현하지 않으면서도, 어떻게 다운스트림 요구사항을 충족하는지 설명합니다.
  context: paragraph
- source: 'Actionbase is optimized for OLTP—fast reads and writes for user-facing interactions. But teams need more:'
  target: Actionbase는 OLTP에 최적화되어 있습니다. 즉, 사용자 대상의 빠른 읽기와 쓰기를 지원합니다. 하지만 팀들은 더 많은 기능이 필요합니다.
  context: paragraph
- source: Building these into Actionbase would compromise its core mission. But ignoring them isn't an option either.
  target: 이러한 기능들을 Actionbase에 직접 구현하면 핵심 미션이 훼손됩니다. 그렇다고 이를 무시하는 것도 불가능합니다.
  context: paragraph
- source: Analytics and dashboards
  target: 분석 및 대시보드
  context: list_item
- source: Fraud detection
  target: 사기 탐지
  context: list_item
- source: ML training data
  target: ML 학습 데이터
  context: list_item
- source: Operations (CS, disaster recovery)
  target: 운영(고객 지원, 재해 복구)
  context: list_item
- source: 'The answer: delegation through event streaming.'
  target: 해답은 이벤트 스트리밍을 통한 위임입니다.
  context: paragraph
- source: Every mutation in Actionbase produces WAL and CDC events. By publishing these to Kafka, Actionbase delegates downstream requirements to specialized systems—while staying focused on what it does best.
  target: Actionbase의 모든 변경(mutation)은 WAL과 CDC 이벤트를 생성합니다. 이 이벤트들을 Kafka로 발행함으로써, Actionbase는 다운스트림 요구사항을 전문화된 시스템에 위임하면서도 본연의 역할에 집중할 수 있습니다.
  context: paragraph
- source: 'By publishing WAL/CDC, Actionbase doesn''t implement these—but makes them possible:'
  target: 'WAL/CDC를 게시함으로써 Actionbase는 이를 직접 구현하지 않지만, 가능하게 만듭니다:'
  context: paragraph
- source: 'CDC consumers (current state):'
  target: 'CDC 컨슈머(현재 상태):'
  context: paragraph
- source: 'WAL consumers (replay):'
  target: 'WAL 컨슈머(재실행):'
  context: paragraph
- source: Actionbase focuses on OLTP. The requirements are still met—through delegation.
  target: Actionbase는 OLTP에 집중합니다. 요구 사항은 여전히 위임(delegation)을 통해 충족됩니다.
  context: paragraph
- source: 'Analytics: OLAP queries, dashboards, insight extraction'
  target: '분석: OLAP 쿼리, 대시보드, 인사이트 추출'
  context: list_item
- source: 'Fraud detection: Abuse patterns, anomaly detection'
  target: '사기 탐지: 악용 패턴, 이상 탐지'
  context: list_item
- source: 'ML: Training data for recommendations'
  target: '머신러닝: 추천 학습을 위한 데이터'
  context: list_item
- source: 'Customer support: All mutations stored in Elasticsearch for short-term CS queries'
  target: '고객 지원: 모든 변경 사항이 Elasticsearch에 저장되어 단기 CS 쿼리에 활용'
  context: list_item
- source: 'Async processing: [Recent Views](/stories/use-cases/kakaotalk-gift-recent-views/) consumes WAL and sends mutations back'
  target: '비동기 처리: [최근 보기](/ko/stories/use-cases/kakaotalk-gift-recent-views/)가 WAL을 소비하고 변경 사항을 다시 전송합니다'
  context: list_item
- source: 'Operations: Data migration, disaster recovery, consistency checks'
  target: '운영: 데이터 마이그레이션, 재해 복구, 일관성 검사'
  context: list_item
- source: Do one thing well. Actionbase handles OLTP; specialized systems handle the rest.
  target: 한 가지 일을 잘하자. Actionbase는 OLTP를 처리하고, 전문화된 시스템이 나머지를 담당합니다.
  context: list_item
- source: Events are the integration layer. WAL/CDC to Kafka decouples producers from consumers.
  target: 이벤트는 통합 계층입니다. WAL/CDC에서 Kafka로 프로듀서와 컨슈머가 분리됩니다.
  context: list_item
- source: Delegation satisfies requirements. You don't have to build everything yourself.
  target: 위임은 요구 사항을 충족합니다. 모든 것을 직접 구축할 필요가 없습니다.
  context: list_item
- source: This pattern lets Actionbase stay focused while enabling capabilities far beyond its core.
  target: 이 패턴을 통해 Actionbase는 핵심 기능에 집중하면서도 그 범위를 훨씬 넘어서는 기능을 구현할 수 있습니다.
  context: paragraph
- source: 'Actionbase publishes events to Kafka at two points:'
  target: Actionbase는 두 지점에서 이벤트를 Kafka로 발행합니다.
  context: paragraph
- source: See [Mutation](/design/mutation/) for the full flow.
  target: 전체 흐름은 [뮤테이션](/ko/design/mutation/)에서 확인할 수 있습니다.
  context: paragraph
- source: 'WAL: Mutation request as-is—replay to rebuild state (idempotent)'
  target: 'WAL: 변경 요청 자체를 그대로 발행—상태를 재구축하기 위한 재생(idempotent)'
  context: list_item
- source: 'CDC: Stored result after processing—accumulate for current snapshot'
  target: 'CDC: 처리 후 저장된 결과를 발행—현재 스냅샷을 누적'
  context: list_item
- source: 'Different backends serve different needs:'
  target: '다양한 백엔드가 각기 다른 요구 사항을 충족합니다:'
  context: paragraph
- source: 'Spark Streaming: Complex event processing, periodic batch jobs'
  target: 'Spark Streaming: 복잡한 이벤트 처리, 주기적인 배치 작업'
  context: list_item
- source: 'Druid: Real-time aggregations, dashboards'
  target: 'Druid: 실시간 집계, 대시보드'
  context: list_item
- source: 'Elasticsearch: Real-time log search, event-by-event lookup (WAL/CDC)'
  target: 'Elasticsearch: 실시간 로그 검색, 이벤트별 조회(WAL/CDC)'
  context: list_item
- source: 'OLAP engines (Presto, Hive, etc.): Ad-hoc queries on large datasets'
  target: 'OLAP 엔진(Presto, Hive 등): 대규모 데이터셋에 대한 애드혹 쿼리'
  context: list_item
- source: Originally, Spark Streaming dumped Kafka periodically, and Spark Batch created snapshots. Recently migrating to Iceberg for more efficient storage.
  target: 원래는 Spark Streaming이 주기적으로 Kafka에 데이터를 덤프하고, Spark Batch가 스냅샷을 생성했습니다. 최근에는 더 효율적인 저장을 위해 Iceberg로 마이그레이션 중입니다.
  context: paragraph
