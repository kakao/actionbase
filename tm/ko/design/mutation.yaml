  target: '[쿼리](/ko/design/query/): 사전 계산된 데이터 읽기'
  context: list_item
- source: '[Mutation API](/api-references/mutation/): API reference'
  target: '[뮤테이션 API](/ko/api-references/mutation/): API 참조'
