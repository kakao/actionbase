  context: paragraph
- source: 'Example: Out-of-Order Events'
  target: '예시: 순서가 뒤바뀐 이벤트'
  context: heading
- source: 'Alice''s actions: like(t=100) → unlike(t=200) → like(t=300)'
  target: '앨리스의 작업: like(t=100) → unlike(t=200) → like(t=300)'
  context: paragraph
- source: 'Events arrive out of order: like(t=100) → like(t=300) → unlike(t=200)'
  target: '이벤트는 순서가 뒤섞여 도착할 수 있습니다: like(t=100) → like(t=300) → unlike(t=200)'
  context: paragraph
- source: '# | Event Arrives | State | Count Change | Total'
  target: '# | 이벤트 도착 시점 | 상태 | 카운트 변화 | 합계'
  context: table
- source: 'Final state: **ACTIVE**, count: **1** — same result regardless of arrival order.'
  target: '최종 상태: **ACTIVE**, 카운트: **1** — 도착 순서와 상관없이 동일한 결과입니다.'
  context: paragraph
- source: Write-Time Optimization
  target: 쓰기 시점 최적화
  context: heading
- source: 'During mutations, Actionbase pre-computes:'
  target: '뮤테이션 동안 Actionbase는 미리 계산합니다:'
  context: paragraph
- source: Structure | Purpose | Query Type
  target: 구조 | 목적 | 쿼리 유형
  context: table
- source: EdgeState | Current edge state | GET
  target: EdgeState | 현재 엣지 상태 | GET
  context: table
- source: EdgeIndex | Sorted entries | SCAN
  target: EdgeIndex | 정렬된 항목 | SCAN
  context: table
- source: EdgeCounter | Aggregated counts | COUNT
  target: EdgeCounter | 집계된 카운트 | COUNT
  context: table
- source: Reads use simple GET, COUNT, SCAN without query-time computation.
  target: 읽기는 쿼리 시점의 계산 없이 간단한 GET, COUNT, SCAN을 사용합니다.
  context: paragraph
- source: Consistency Guarantees
  target: 일관성 보장
  context: heading
- source: Mechanism | Guarantee
  target: 메커니즘 | 보장 내용
  context: table
- source: WAL | Durability and recovery
  target: WAL | 내구성 및 복구
  context: table
- source: Read-Modify-Write | Mutations based on latest state
  target: Read-Modify-Write | 최신 상태를 기반으로 한 뮤테이션
  context: table
- source: State Transitions | Correct final state despite event arrival
  target: State Transitions | 이벤트 도착에도 불구하고 올바른 최종 상태 유지
  context: table
- source: Idempotency | Replay produces same result
  target: Idempotency | 재실행해도 동일한 결과 생성
  context: table
- source: Next Steps
  target: 다음 단계
  context: heading
