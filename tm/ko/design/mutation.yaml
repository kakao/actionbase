entries:
- source: Mutation
  target: 뮤테이션
  context: frontmatter:title
- source: Understanding how mutations work in Actionbase
  target: Actionbase에서 뮤테이션이 작동하는 방식 이해하기
  context: frontmatter:description
- source: Mutations insert, update, and delete edges. The process ensures consistency, durability, and write-time optimization.
  target: 뮤테이션은 엣지의 삽입, 업데이트, 삭제를 수행합니다. 이 과정은 일관성, 내구성, 쓰기 시점 최적화를 보장합니다.
  context: paragraph
- source: See [Core Concepts](/design/concepts/) for background.
  target: 배경 설명은 [핵심 개념](/ko/design/concepts/)을 참조하세요.
  context: paragraph
- source: Mutation Flow
  target: 뮤테이션 흐름
  context: heading
- source: Mutation Request
  target: 뮤테이션 요청
  context: heading
- source: 'A mutation request contains:'
  target: '뮤테이션 요청에는 다음이 포함됩니다:'
  context: paragraph
- source: '**Event**: The data change (e.g., new property values, edge creation)'
  target: '**이벤트**: 데이터 변경 사항(예: 새로운 프로퍼티 값, 엣지 생성)'
  context: list_item
- source: '**Operation**: Insert, Update, or Delete'
  target: '**작업**: 삽입, 업데이트, 삭제'
  context: list_item
- source: Mutation Process
  target: 뮤테이션 처리 과정
  context: heading
- source: 1. Write WAL
  target: 1. WAL 기록
  context: heading
- source: Mutation is written to WAL before changes are made. Enables recovery and replay.
  target: 변경 사항이 적용되기 전에 뮤테이션이 WAL에 기록됩니다. 복구 및 재생을 가능하게 합니다.
  context: paragraph
- source: In production, Kafka is used as WAL backend.
  target: 프로덕션 환경에서는 WAL 백엔드로 Kafka가 사용됩니다.
  context: paragraph
- source: 2. Acquire Lock
  target: 2. 락 획득
  context: heading
- source: 'Prevents concurrent modifications:'
  target: '동시 수정을 방지합니다:'
  context: paragraph
- source: '**Unique edges**: Lock on (source, target)'
  target: '**고유 엣지**: (소스, 타겟)에 대한 락'
  context: list_item
- source: '**Multi edges**: Lock on edge ID'
  target: '**다중 엣지**: 엣지 ID에 대한 락'
  context: list_item
- source: 3. Read State
  target: 3. 상태 읽기
  context: heading
- source: Read current state from storage—properties, timestamps, metadata.
  target: 스토리지에서 현재 상태(프로퍼티, 타임스탬프, 메타데이터)를 읽습니다.
  context: paragraph
- source: 4. Apply Event
  target: 4. 이벤트 적용
  context: heading
- source: Transition state based on operation and client timestamp. See [State Transitions](#state-transitions) for details.
  target: 작업 및 클라이언트 타임스탬프를 기반으로 상태를 전환합니다. 자세한 내용은 [상태 전환](#state-transitions)을 참조하세요.
  context: paragraph
- source: 5. Compute Indexes and Counters
  target: 5. 인덱스 및 카운터 계산
  context: heading
- source: 'Based on changed state:'
  target: '변경된 상태를 기반으로:'
  context: paragraph
- source: '**Indexes**: Delete old, create new'
  target: '**인덱스**: 기존 인덱스 삭제, 새 인덱스 생성'
  context: list_item
- source: '**Counters**: Increment or decrement'
  target: '**카운터**: 증가 또는 감소'
  context: list_item
- source: 6. Write to Storage
  target: 6. 스토리지에 쓰기
  context: heading
- source: State, indexes, and counters written atomically.
  target: 상태, 인덱스 및 카운터가 원자적으로 기록됩니다.
  context: paragraph
- source: 7. Release Lock
  target: 7. 락 해제
  context: heading
- source: Lock released after write.
  target: 쓰기 후 락이 해제됩니다.
  context: paragraph
- source: 8. Write CDC
  target: 8. CDC 기록
  context: heading
- source: Mutation recorded in CDC (Kafka in production). Resulting state available for downstream systems.
  target: 뮤테이션이 CDC(프로덕션 환경에서는 Kafka)에 기록됩니다. 결과 상태가 다운스트림 시스템에서 사용할 수 있게 됩니다.
  context: paragraph
- source: State Transitions
  target: 상태 전환
  context: heading
- source: Edges transition between states based on operations (INSERT, DELETE). Each event carries a client timestamp, and Actionbase uses these timestamps to compute the correct final state—even for out-of-order arrivals and duplicate requests (idempotent).
  target: 엣지는 작업(INSERT, DELETE)에 따라 상태가 전환됩니다. 각 이벤트는 클라이언트 타임스탬프를 포함하며, Actionbase는 이 타임스탬프를 사용하여 올바른 최종 상태를 계산합니다. 이는 순서가 뒤바뀐 도착 및 중복 요청(멱등성)에도 적용됩니다.
  context: paragraph
- source: See [`State.transit`](https://github.com/kakao/actionbase/blob/main/core/src/main/kotlin/com/kakao/actionbase/core/state/StateExtensions.kt) for implementation.
  target: 구현은 [`State.transit`](https://github.com/kakao/actionbase/blob/main/core/src/main/kotlin/com/kakao/actionbase/core/state/StateExtensions.kt)을 참조하세요.
  context: paragraph
- source: Diagram
  target: 다이어그램
  context: heading
- source: Full state transition diagram
  target: 전체 상태 전환 다이어그램
  context: summary
