entries:
- source: Storage Backends
  target: 스토리지 백엔드
  context: frontmatter:title
- source: Understanding storage backends in Actionbase
  target: Actionbase에서 스토리지 백엔드에 대한 이해
  context: frontmatter:description
- source: Actionbase abstracts storage through a minimal interface called `Datastore`. Different backends can be integrated.
  target: Actionbase는 `Datastore`라는 최소 인터페이스를 통해 스토리지를 추상화합니다. 다양한 백엔드를 통합할 수 있습니다.
  context: paragraph
- source: Required Operations
  target: 필수 연산
  context: heading
- source: 'A storage backend must support:'
  target: '스토리지 백엔드는 다음 연산을 지원해야 합니다:'
  context: paragraph
- source: Operation | Description
  target: 연산 | 설명
  context: table
- source: get | Retrieve value(s) by key(s)
  target: get | 키로 값(들)을 조회
  context: table
- source: delete | Delete a value by key
  target: delete | 키로 값을 삭제
  context: table
- source: scan | Range scan with prefix, start, stop, limit
  target: scan | 프리픽스, 시작, 종료, 제한으로 범위 스캔
  context: table
- source: checkAndMutate | Atomic check-and-mutate for consistency
  target: checkAndMutate | 일관성 유지를 위한 원자적 체크-및-변경
  context: table
- source: batch | Batch mutations (optional, recommended)
  target: batch | 일괄 변경(선택 사항, 권장)
  context: table
- source: Supported Backends
  target: 지원 백엔드
  context: heading
- source: Production backend. Distributed, scalable NoSQL on HDFS.
  target: 프로덕션 백엔드. HDFS 기반의 분산형, 확장 가능한 NoSQL 데이터베이스입니다.
  context: paragraph
- source: Characteristic | Description
  target: 특성 | 설명
  context: table
- source: HBase requires expertise when used directly (row key design, region splitting, cluster management). Actionbase provides a higher-level abstraction with interaction-specific features (State/Index/Count).
  target: HBase는 직접 사용할 경우 전문 지식이 필요합니다(행 키 설계, 리전 분할, 클러스터 관리 등). Actionbase는 State/Index/Count와 같은 인터랙션 특화 기능을 갖춘 더 높은 수준의 추상화를 제공합니다.
  context: paragraph
- source: See [HBase Operations](/operations/hbase/).
  target: '[HBase 운영 가이드](/ko/operations/hbase/)를 참고하세요.'
  context: paragraph
- source: Memory
  target: 메모리
  context: heading
- source: In-memory backend for development and testing.
  target: 개발 및 테스트를 위한 인메모리 백엔드입니다.
  context: paragraph
- source: Ideal for local development and prototyping.
  target: 로컬 개발 및 프로토타이핑에 적합합니다.
  context: paragraph
- source: How Actionbase Uses Storage
  target: Actionbase가 스토리지를 사용하는 방법
  context: heading
