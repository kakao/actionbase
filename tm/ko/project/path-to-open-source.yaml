entries:
- source: Path to Open Source
  target: 오픈 소스 경로
  context: frontmatter:title
- source: Actionbase project development history before open source
  target: 오픈 소스 이전의 Actionbase 프로젝트 개발 역사
  context: frontmatter:description
- source: This document covers the development history of Actionbase before it was open-sourced. Future development will be tracked in public repositories.
  target: 이 문서는 Actionbase가 오픈 소스화되기 전의 개발 역사를 다룹니다. 향후 개발은 공개 저장소에서 추적됩니다.
  context: paragraph
- source: MVP Phase
  target: MVP 단계
  context: heading
- source: The MVP phase represents the entire period from project inception to open-source release. During this period, Actionbase was applied to various services and evolved through real-world use.
  target: MVP 단계는 프로젝트 착수부터 오픈 소스 출시까지의 전체 기간을 의미합니다. 이 기간 동안 Actionbase는 다양한 서비스에 적용되며 실제 사용을 통해 진화했습니다.
  context: paragraph
- source: 'Phase 1: Foundation Building (2023)'
  target: '1단계: 기반 구축 (2023년)'
  context: heading
- source: This period was invested to ensure a technical base that would support stable development in subsequent phases.
  target: 이 기간에는 이후 단계의 안정적인 개발을 지원할 수 있는 기술적 기반을 마련하는 데 집중했습니다.
  context: paragraph
- source: 'Key milestones:'
  target: '주요 마일스톤:'
  context: paragraph
- source: Project kickoff and initial planning
  target: 프로젝트 착수 및 초기 기획
  context: list_item
- source: Core design and implementation
  target: 핵심 설계 및 구현
  context: list_item
- source: 'AI used: GPT-4'
  target: '사용한 AI: GPT-4'
  context: paragraph
- source: 'Phase 2: Service Integration (Early 2024)'
  target: '2단계: 서비스 통합 (2024년 초)'
  context: heading
- source: The system was safely integrated into production by maintaining the existing system, applying dual writes, and gradually migrating read functionality after sufficient validation.
  target: 기존 시스템을 유지하면서 이중 쓰기(dual writes)를 적용하고, 충분한 검증 후 읽기 기능을 점진적으로 마이그레이션하여 시스템을 안전하게 프로덕션에 통합했습니다.
  context: paragraph
- source: 'Key activities:'
  target: '주요 활동:'
  context: paragraph
- source: 'First production service write/read migration: [KakaoTalk Gift Wish](/stories/use-cases/kakaotalk-gift-wish/)'
  target: '첫 프로덕션 서비스 쓰기/읽기 마이그레이션: [카카오톡 선물 위시](/ko/stories/use-cases/kakaotalk-gift-wish/)'
  context: list_item
- source: 'Phase 3: Stabilization (Late 2024)'
  target: '3단계: 안정화 (2024년 말)'
  context: heading
- source: Starting from a multi-tenant architecture, this phase introduced support for independent tenant configurations to ensure service isolation and enable isolated deployments.
  target: 멀티 테넌트 아키텍처를 기반으로, 이 단계에서는 서비스 격리와 독립적인 배포를 지원하기 위해 독립적인 테넌트 구성을 도입했습니다.
  context: paragraph
- source: 'Key improvements:'
  target: '주요 개선 사항:'
  context: paragraph
- source: System stabilization and tenant expansion
  target: 시스템 안정화 및 테넌트 확장
  context: list_item
- source: Support for independent tenant configurations to isolate services
  target: 서비스 격리를 위한 독립적인 테넌트 구성 지원
  context: list_item
- source: Operations automation and monitoring enhancement
  target: 운영 자동화 및 모니터링 향상
  context: list_item
- source: Applied across commerce domain (e.g., [KakaoTalk Gift Recent Views](/stories/use-cases/kakaotalk-gift-recent-views/))
  target: '커머스 도메인 전반에 적용되었습니다 (예: [카카오톡 선물하기 최근 조회](/ko/stories/use-cases/kakaotalk-gift-recent-views/))'
  context: list_item
- source: 'AI used: Claude 3.5 Sonnet'
  target: AI로 Claude 3.5 Sonnet을 사용했습니다
  context: paragraph
- source: 'Phase 4: Building Sustainable Operations (Early 2025)'
  target: '4단계: 지속 가능한 운영 구축 (2025년 초)'
  context: heading
- source: During this phase, Actionbase continued to be applied to various services while improving its operational foundation. Key efforts included reducing operational overhead, improving developer tooling, and addressing accumulated technical debt.
  target: 이 단계에서 Actionbase는 다양한 서비스에 계속 적용되면서 운영 기반을 개선했습니다. 주요 활동으로는 운영 오버헤드 감소, 개발자 도구 개선, 누적된 기술 부채 해결이 포함되었습니다
  context: paragraph
- source: Applied across multiple domains (e.g., [KakaoTalk Friends](/stories/use-cases/kakaotalk-friends/))
  target: '여러 도메인에 적용되었습니다 (예: [카카오톡 친구](/ko/stories/use-cases/kakaotalk-friends/))'
  context: list_item
- source: 'AI used: GPT-4o, Claude 3.5 Sonnet'
  target: AI로 GPT-4o, Claude 3.5 Sonnet을 사용했습니다
  context: paragraph
- source: 'Phase 5: Preparing for Open Source (2025)'
  target: '5단계: 오픈 소스 준비 (2025년)'
  context: heading
- source: Building on the foundation from Phase 4, this phase focused on making Actionbase ready for open source. The reimplementation process led to the decision to open-source Actionbase. While legacy code remains, the reimplementation continues to progress toward a more maintainable codebase. During this period, Actionbase was broadly adopted across [Kakao](/project/about-kakao/)'s services.
  target: 4단계의 기반을 바탕으로 이 단계에서는 Actionbase를 오픈 소스로 공개할 수 있도록 준비했습니다. 재구현 과정을 통해 오픈 소스화 결정이 내려졌으며, 기존 코드는 남아 있지만 재구현은 더 유지 관리 가능한 코드베이스를 향해 계속 진행되고 있습니다. 이 기간 동안 Actionbase는 [카카오](/ko/project/about-kakao/)의 서비스에 폭넓게 적용되었습니다
  context: paragraph
- source: 'Key changes:'
  target: '주요 변경 사항:'
  context: paragraph
- source: Maintained API compatibility with existing systems
  target: 기존 시스템과의 API 호환성 유지
  context: list_item
- source: Redesigned API structure
  target: API 구조 재설계
  context: list_item
- source: Repository separation and organization
  target: 저장소 분리 및 정리
  context: list_item
- source: Separated internal and open-source areas
  target: 내부 영역과 오픈 소스 영역 분리
  context: list_item
- source: 'AI used: GPT-4o, Claude 3.5 Sonnet, Cursor'
  target: AI로 GPT-4o, Claude 3.5 Sonnet, Cursor를 사용했습니다
  context: paragraph
- source: Open Source Release (January 2026)
  target: 오픈 소스 공개 (2026년 1월)
  context: heading
- source: After this MVP period, Actionbase was open-sourced in January 2026.
  target: 이 MVP 기간 이후 Actionbase는 2026년 1월에 오픈 소스화되었습니다
  context: paragraph
- source: The codebase released is the same one that was developed, operated, and refined inside Kakao. Only minimal modifications were applied to remove security-sensitive or organization-specific details, and some internal features will be opened gradually as they are reviewed.
  target: 공개된 코드베이스는 카카오 내부에서 개발, 운영, 개선된 것과 동일합니다. 보안상 민감하거나 조직 특화 정보는 최소한의 수정으로 제거되었으며, 일부 내부 기능은 검토 후 점진적으로 공개될 예정입니다
  context: paragraph
- source: Why We Open-Sourced Actionbase
  target: 왜 우리는 Actionbase를 오픈 소스화했는가
  context: heading
- source: The same interaction features—likes, recent views, follows—were being rebuilt across teams, each time with different stacks, different schemas, different failure modes. And when traffic grew, each hit similar scaling walls.
  target: 동일한 인터랙션 기능—좋아요, 최근 조회, 팔로우—가 여러 팀에서 각기 다른 스택, 스키마, 장애 양상으로 매번 다시 구축되고 있었습니다. 트래픽이 증가하면 각 시스템도 유사한 확장 한계에 부딪혔습니다.
  context: paragraph
- source: Actionbase emerged as an attempt to stop solving the same problem ten different ways—and to solve it at scale.
  target: Actionbase는 같은 문제를 열 가지 방식으로 다시 푸는 일을 멈추고, 대규모로 한 번에 해결하기 위해 등장했습니다.
  context: paragraph
- source: '**Sharing a real journey**'
  target: 실제 여정을 공유하다
  context: paragraph
- source: This codebase wasn't designed for release. It grew through production incidents, shifting requirements, and years of real traffic. We chose to share it as-is—not a rewritten showcase, but the actual code that survived.
  target: 이 코드베이스는 공개를 염두에 두고 설계되지 않았습니다. 실제 트래픽, 변화하는 요구사항, 운영 중 발생한 이슈들을 거치며 성장했습니다. 우리는 이를 다듬지 않은 채, 실제로 살아남은 코드 그대로 공개하기로 했습니다.
  context: paragraph
- source: '**Outliving its creators**'
  target: 만든 이를 넘어서다
  context: paragraph
- source: Internal systems often fade when their original maintainers move on. Open-sourcing creates a chance for the system to grow beyond any single team or company—shaped by those who actually use it.
  target: 내부 시스템은 원래 담당자가 떠나면 사라지는 경우가 많습니다. 오픈 소스화는 시스템이 단일 팀이나 회사를 넘어, 실제로 사용하는 사람들에 의해 진화할 수 있는 기회를 만듭니다.
  context: paragraph
- source: '**Becoming part of something larger**'
  target: 더 큰 무언가의 일부가 되다
  context: paragraph
- source: Inside a company, an internal service is just another API to call. Developers designing new systems rarely adopt it as a core component, working with well-known technologies feels more valuable for their growth.
  target: 회사 내부에서는 내부 서비스가 그저 호출하는 또 다른 API에 불과합니다. 새로운 시스템을 설계하는 개발자들은 잘 알려진 기술을 사용하는 것이 자신의 성장에 더 가치 있다고 느껴, 이를 핵심 컴포넌트로 채택하는 일이 드뭅니다.
  context: paragraph
- source: We understand this. By open-sourcing Actionbase, we hope it can become part of architectures we never imagined.
  target: 우리도 이를 이해합니다. Actionbase를 오픈 소스화함으로써, 우리가 상상하지 못한 아키텍처의 일부가 되기를 바랍니다.
  context: paragraph
- source: Acknowledgements
  target: 감사의 말씀
  context: heading
- source: This work was supported by Kakao's leaders and engineers, who helped the team build and operate the system.
  target: 이 작업은 카카오는 물론, 시스템을 구축하고 운영한 리더들과 엔지니어들의 지원으로 이루어졌습니다.
  context: paragraph
- source: Special appreciation goes to the HBase engineers at Kakao. Actionbase's reliability benefits from the stability provided by HBase.
  target: 특별히 카카오의 HBase 엔지니어들에게 감사를 전합니다. Actionbase의 신뢰성은 HBase가 제공하는 안정성 덕분에 더욱 견고해졌습니다.
  context: paragraph
- source: This release reflects the efforts of those who contributed to the system and the teams who supported its development. We look forward to continuing this project together with the open-source community.
  target: 이 공개는 시스템에 기여한 모든 분들과 개발을 지원한 팀들의 노력을 반영합니다. 오픈 소스 커뮤니티와 함께 이 프로젝트를 계속 이어나가길 기대합니다.
  context: paragraph
