entries:
- source: Contributing
  target: 기여하기
  context: frontmatter:title
- source: How to participate in the Actionbase project
  target: Actionbase 프로젝트에 참여하는 방법
  context: frontmatter:description
- source: Thank you for your interest in Actionbase. Any form of participation—using the project, asking questions, reporting issues, improving documentation, or contributing code—is appreciated.
  target: Actionbase에 관심을 가져주셔서 감사합니다. 프로젝트 사용, 질문, 이슈 보고, 문서 개선, 코드 기여 등 어떤 형태의 참여든 감사드립니다.
  context: paragraph
- source: How we collaborate
  target: 협업 방식
  context: heading
- source: 'We collaborate through [GitHub](https://github.com/kakao/actionbase):'
  target: '[GitHub](https://github.com/kakao/actionbase)를 통해 협업합니다:'
  context: paragraph
- source: '**[Discussions](https://github.com/kakao/actionbase/discussions)**: Questions, ideas, and open-ended conversations'
  target: '**[Discussions](https://github.com/kakao/actionbase/discussions)**: 질문, 아이디어, 자유로운 대화'
  context: list_item
- source: '**[Issues](https://github.com/kakao/actionbase/issues)**: Bug reports, feature requests, and concrete improvements'
  target: '**[Issues](https://github.com/kakao/actionbase/issues)**: 버그 보고, 기능 요청, 구체적인 개선 사항'
  context: list_item
- source: '**[Pull Requests](https://github.com/kakao/actionbase/pulls)**: Code and documentation changes'
  target: '**[Pull Requests](https://github.com/kakao/actionbase/pulls)**: 코드 및 문서 변경'
  context: list_item
- source: For questions, ideas, or feedback, join us on [Discussions](https://github.com/kakao/actionbase/discussions).
  target: 질문, 아이디어 또는 피드백이 있으시면 [Discussions](https://github.com/kakao/actionbase/discussions)에 참여해 주세요.
  context: paragraph
- source: Pull requests are reviewed collaboratively and merged by Maintainers.
  target: Pull request는 협력적으로 리뷰되며 Maintainer가 병합합니다.
  context: paragraph
- source: When submitting a pull request, please sign the [CLA](https://cla-assistant.io/kakao/actionbase) (Contributor Licensing Agreement) for Individual. If you need a Contributor Licensing Agreement for Corporate, please [contact us](mailto:oss@kakaocorp.com).
  target: Pull request를 제출할 때 Individual용 [CLA](https://cla-assistant.io/kakao/actionbase) (Contributor Licensing Agreement)에 서명해 주세요. Corporate용 Contributor Licensing Agreement가 필요한 경우 [문의해 주세요](mailto:oss@kakaocorp.com).
  context: paragraph
- source: Getting started
  target: 시작하기
  context: heading
- source: New to open source? Look for issues labeled **[good first issue](https://github.com/kakao/actionbase/labels/good%20first%20issue)**.
  target: 오픈소스가 처음이신가요? **[good first issue](https://github.com/kakao/actionbase/labels/good%20first%20issue)** 레이블이 붙은 이슈를 찾아보세요.
  context: paragraph
- source: For local development setup — see [Development Setup](/community/development/).
  target: 로컬 개발 환경 설정은 [개발 환경 설정](/ko/community/development/)을 참고하세요.
  context: paragraph
- source: Translations
  target: 번역
  context: heading
- source: We welcome documentation translations. When submitting translation PRs, please submit **one section (folder) per PR** rather than translating all pages at once. This makes reviews manageable and allows incremental progress.
  target: 문서 번역 기여를 환영합니다. 번역 PR을 제출할 때는 한 번에 모든 페이지가 아닌 **섹션(폴더) 단위로 PR을 제출**해 주세요. 이렇게 하면 리뷰가 용이하고 점진적으로 진행할 수 있습니다.
  context: paragraph
- source: Security
  target: 보안
  context: heading
- source: Report security vulnerabilities through [GitHub Security Advisories](https://github.com/kakao/actionbase/security/advisories/new) instead of opening a public issue.
  target: 보안 취약점은 공개 이슈 대신 [GitHub Security Advisories](https://github.com/kakao/actionbase/security/advisories/new)를 통해 보고해 주세요.
  context: paragraph
- source: Community standards
  target: 커뮤니티 표준
  context: heading
- source: All contributors are expected to follow the **[Code of Conduct](https://github.com/kakao/actionbase/blob/main/CODE_OF_CONDUCT.md)**.
  target: 모든 기여자는 **[행동 강령](https://github.com/kakao/actionbase/blob/main/CODE_OF_CONDUCT.md)**을 따라야 합니다.
  context: paragraph
- source: For project roles — see [Governance](/community/governance/).
  target: 프로젝트 역할에 대해서는 [거버넌스](/ko/community/governance/)를 참고하세요.
  context: paragraph
- source: Contributors
  target: 기여자
  context: heading
