entries:
- source: For RDB Users
  target: RDB 사용자를 위한 안내
  context: frontmatter:title
- source: Understanding Actionbase from a relational database perspective
  target: 관계형 데이터베이스 관점에서 Actionbase 이해하기
  context: frontmatter:description
- source: For users familiar with relational databases who want to understand how Actionbase fits alongside an RDB.
  target: 관계형 데이터베이스를 사용하는 사용자가 Actionbase가 RDB와 어떻게 연계되는지 이해하고자 할 때
  context: paragraph
- source: Why Consider Actionbase?
  target: Actionbase를 고려해야 하는 이유
  context: heading
- source: 'As services grow, tables storing user interactions—likes, recent views, follows—often hit scaling walls:'
  target: '서비스가 성장함에 따라, 좋아요, 최근 조회, 팔로우와 같은 사용자 인터랙션 데이터를 저장하는 테이블이 종종 확장 한계에 부딪힙니다:'
  context: paragraph
- source: Shard key management and hot entities
  target: 샤드 키 관리와 핫 엔티티
  context: list_item
- source: Cross-shard queries
  target: 샤드 간 쿼리
  context: list_item
- source: Cache consistency
  target: 캐시 일관성
  context: list_item
- source: Actionbase handles these by modeling interactions as **who** did **what** to which **target**, with write-time materialization on horizontally scalable storage.
  target: Actionbase는 이러한 문제를 **누가** 어떤 **대상**에 대해 어떤 **행위**를 했는지 모델링하고, 쓰기 시점에 수평 확장 가능한 스토리지에 실시간 머티리얼라이제이션을 적용하여 해결합니다.
  context: paragraph
- source: From Tables to Interactions
  target: 테이블에서 인터랙션으로 전환
  context: heading
- source: 'In an RDB, interaction data often lives in tables like:'
  target: 'RDB에서는 인터랙션 데이터가 다음과 같은 테이블에 저장되는 경우가 많습니다:'
  context: paragraph
- source: '`user_follows` (user–user)'
  target: '`user_follows` (사용자-사용자)'
  context: list_item
- source: '`user_likes` (user–item)'
  target: '`user_likes` (사용자-아이템)'
  context: list_item
- source: '`user_views` (user–item)'
  target: '`user_views` (사용자-아이템)'
  context: list_item
- source: 'In Actionbase, these become edges:'
  target: 'Actionbase에서는 이것들이 엣지로 변환됩니다:'
  context: paragraph
- source: '**Source**: who (e.g., user_id)'
  target: '**소스**: 누가 (예: user_id)'
  context: list_item
- source: '**Target**: what (e.g., product_id, user_id)'
  target: '**타겟**: 무엇을 (예: product_id, user_id)'
  context: list_item
- source: '**Properties**: schema-defined (e.g., `created_at`)'
  target: '**프로퍼티**: 스키마 정의 (예: `created_at`)'
  context: list_item
- source: Read-optimized structures (indexes, counts) are pre-computed at write time.
  target: 읽기 최적화 구조(인덱스, 카운트 등)는 쓰기 시점에 미리 계산됩니다.
  context: paragraph
- source: When Actionbase Fits
  target: Actionbase가 적합한 경우
  context: heading
- source: Interaction tables dominate volume
  target: 인터랙션 테이블이 데이터 볼륨을 주도합니다.
  context: list_item
- source: Queries focus on listing or counting relationships
  target: 쿼리는 관계 목록을 조회하거나 개수를 세는 데 집중합니다.
  context: list_item
- source: Sharding these tables gets painful
  target: 이러한 테이블을 샤딩하면 문제가 발생합니다.
  context: list_item
- source: Using Actionbase with an RDB
  target: RDB와 함께 Actionbase 사용하기
  context: heading
- source: Actionbase complements an RDB, not replaces it.
  target: Actionbase는 RDB를 대체하는 것이 아니라 보완합니다.
  context: paragraph
- source: 'A common pattern:'
  target: '일반적인 패턴은 다음과 같습니다:'
  context: paragraph
- source: Transactional and domain data stays in RDB
  target: 트랜잭션 및 도메인 데이터는 RDB에 유지합니다.
  context: list_item
- source: Large-scale interaction data moves to Actionbase
  target: 대규모 인터랙션 데이터는 Actionbase로 이동합니다.
  context: list_item
- source: Interaction queries served from Actionbase
  target: 인터랙션 쿼리는 Actionbase에서 제공됩니다.
  context: list_item
- source: Start by migrating only the tables that present scaling challenges.
  target: 먼저 확장성 문제가 발생하는 테이블만 마이그레이션하세요.
  context: paragraph
- source: 'Example: Mapping a Table'
  target: '예시: 테이블 매핑'
  context: heading
- source: The `id` column is not needed—unique-edges are identified by source and target.
  target: '`id` 컬럼은 필요하지 않습니다. 고유한 엣지는 source와 target으로 식별됩니다.'
  context: paragraph
- source: '**Note:** For multi-edge cases (e.g., multiple gifts from the same user to the same recipient), each edge requires a unique `id` — see [FAQ](/faq/#what-is-the-difference-between-unique-edge-and-multi-edge).'
  target: '**참고**: 다중 엣지 케이스(예: 동일한 사용자가 동일한 수신자에게 여러 번 선물한 경우)에서는 각 엣지에 고유한 `id`가 필요합니다. [FAQ](/ko/faq/#what-is-the-difference-between-unique-edge-and-multi-edge)를 참조하세요.'
  context: blockquote
- source: 'Indexes for efficient queries:'
  target: '효율적인 쿼리를 위한 인덱스:'
  context: paragraph
- source: '`created_at DESC` — recent wishes'
  target: '`created_at DESC` — 최근 위시리스트를 빠르게 조회합니다.'
  context: list_item
- source: '`visibility, created_at DESC` — filtered by visibility'
  target: '`visibility, created_at DESC` — visibility(으)로 필터링됨'
  context: list_item
- source: Next Steps
  target: 다음 단계
  context: heading
- source: '[Schema](/design/schema/) — Define your edge schema'
  target: '[스키마](/ko/design/schema/) — 엣지 스키마를 정의하세요'
  context: list_item
- source: '[Quick Start](/quick-start/) — Try Actionbase in minutes'
  target: '[빠른 시작](/ko/quick-start/) — Actionbase를 몇 분 만에 체험해보세요'
  context: list_item
