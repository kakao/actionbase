- source: Defining the structure of your interaction data
  target: 인터랙션 데이터의 구조를 정의합니다
  context: frontmatter:description
- source: Schema defines the structure of interaction data. Before storing data, define how edges are structured, what properties they have, and how they can be queried.
  target: 스키마는 인터랙션 데이터의 구조를 정의합니다. 데이터를 저장하기 전에 엣지가 어떻게 구조화되어 있는지, 어떤 프로퍼티를 가지는지, 그리고 어떻게 쿼리할 수 있는지 정의해야 합니다.
  context: paragraph
- source: See [Core Concepts](/design/concepts/) for background.
  target: 자세한 내용은 [핵심 개념](/ko/design/concepts/)을 참조하세요.
  context: paragraph
- source: Schema Hierarchy
  target: 스키마 계층 구조
  context: heading
- source: Actionbase was open-sourced during the v3 transition. Most docs use v3 terms, but this document uses v2 terms (current Schema API). v3 terms are noted in parentheses. See the last section for full mapping.
  target: Actionbase는 v3 전환 시점에 오픈소스로 공개되었습니다. 대부분의 문서는 v3 용어를 사용하지만, 이 문서는 v2 용어(현재 스키마 API)를 사용합니다. v3 용어는 괄호로 표시되어 있습니다. 마지막 섹션에서 전체 매핑 정보를 확인할 수 있습니다.
  context: paragraph
- source: '**Service** groups related Labels and Aliases'
  target: '**서비스**는 관련된 레이블과 별칭을 그룹화합니다'
  context: list_item
- source: '**Label** defines the schema for edges'
  target: '**레이블**은 엣지에 대한 스키마를 정의합니다'
  context: list_item
- source: '**Alias** provides an alternative name for a Label'
  target: '**별칭**은 레이블에 대한 대체 이름을 제공합니다'
