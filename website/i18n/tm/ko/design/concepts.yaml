entries:
- source: Core Concepts
  target: 핵심 개념
  context: frontmatter:title
- source: Core concepts behind Actionbase design
  target: Actionbase 설계의 핵심 개념
  context: frontmatter:description
- source: Actionbase is a database for serving user interactions—not a general-purpose graph database.
  target: Actionbase는 범용 그래프 데이터베이스가 아니라 사용자 인터랙션을 제공하기 위한 데이터베이스입니다.
  context: paragraph
- source: Design Goals
  target: 설계 목표
  context: heading
- source: '**Write-Time Optimization** — Pre-compute read structures at write time. Reads become simple lookups.'
  target: '**쓰기 시점 최적화** — 쓰기 시점에 읽기 구조를 미리 계산합니다. 읽기는 단순 조회가 됩니다.'
  context: list_item
- source: '**Leverage Proven Storage** — Build on HBase for durability and scale. Don''t reinvent storage.'
  target: '**검증된 스토리지 활용** — 내구성과 확장성을 위해 HBase 위에 구축합니다. 스토리지는 새로 만들지 않습니다.'
  context: list_item
- source: User Interactions
  target: 사용자 인터랙션
  context: heading
- source: 'Actionbase handles:'
  target: 'Actionbase는 다음을 처리합니다:'
  context: paragraph
- source: Recent views (products, content)
  target: 최근 조회(상품, 콘텐츠)
  context: list_item
- source: Likes and reactions
  target: 좋아요 및 반응
  context: list_item
- source: Follows
  target: 팔로우
  context: list_item
- source: 'These share common characteristics: **who** did **what** to which **target**, real-time access, predictable query patterns.'
  target: '이들은 공통적인 특성을 가집니다: **누가** **무엇을** 어떤 **대상**에 했는지, 실시간 접근, 예측 가능한 쿼리 패턴.'
  context: paragraph
- source: Property Graph Model
  target: 프로퍼티 그래프 모델
  context: heading
- source: 'Actionbase models interactions as edges:'
  target: 'Actionbase는 인터랙션을 엣지로 모델링합니다:'
  context: paragraph
- source: '**Source**: who (e.g., user_id)'
  target: '**소스**: 누가(예: user_id)'
  context: list_item
- source: '**Target**: what (e.g., product_id, content_id, user_id)'
  target: '**타겟**: 무엇을(예: product_id, content_id, user_id)'
  context: list_item
- source: '**Properties**: schema-defined attributes (e.g., `created_at`, `reaction_type`)'
  target: '**프로퍼티**: 스키마로 정의된 속성(예: `created_at`, `reaction_type`)'
  context: list_item
- source: See [Schema](/design/schema/) for defining your edges.
  target: 엣지 정의는 [스키마](/ko/design/schema/)를 참고하세요.
  context: paragraph
- source: State and Event Model
  target: 상태 및 이벤트 모델
  context: heading
- source: 'Actionbase uses a state-based mutation model:'
  target: 'Actionbase는 상태 기반 뮤테이션 모델을 사용합니다:'
  context: paragraph
- source: '**State**: current state (e.g., "user liked product")'
  target: '**상태**: 현재 상태(예: "사용자가 상품을 좋아함")'
  context: list_item
- source: '**Event**: input that transitions state (e.g., "user clicked like")'
  target: '**이벤트**: 상태를 전환하는 입력(예: "사용자가 좋아요 클릭")'
  context: list_item
- source: 'When an interaction occurs:'
  target: '상호작용이 발생하면:'
  context: paragraph
- source: Read current state
  target: 현재 상태를 읽음
  context: list_item
- source: Apply state transition
  target: 상태 전환을 적용함
  context: list_item
- source: Store new state
  target: 새 상태를 저장함
  context: list_item
- source: Clients attach timestamps to events. Even if events arrive out of order, Actionbase computes the correct final state.
  target: 클라이언트는 이벤트에 타임스탬프를 부여합니다. 이벤트가 순서가 뒤섞여 도착하더라도 Actionbase는 올바른 최종 상태를 계산합니다.
  context: paragraph
- source: See [Mutation](/design/mutation/) for details.
  target: 자세한 내용은 [뮤테이션](/ko/design/mutation/)을 참조하세요.
  context: paragraph
- source: Write-Time Optimization
  target: 쓰기 시점 최적화
  context: heading
- source: 'When an edge is written, Actionbase pre-computes:'
  target: '엣지가 쓰일 때 Actionbase는 미리 계산합니다:'
  context: paragraph
- source: '**State** — current relationship between source and target'
  target: '**상태** — 소스와 타겟 간의 현재 관계'
  context: list_item
- source: '**Index** — ordered structures based on properties (e.g., `created_at DESC`)'
  target: '**인덱스** — 프로퍼티 기반 정렬 구조(예: `created_at DESC`)'
  context: list_item
- source: '**Count** — counters (e.g., number of likes per item)'
  target: '**카운터** — 카운터(예: 아이템별 좋아요 수)'
  context: list_item
- source: Reads use simple GET, COUNT, SCAN operations without query-time computation.
  target: 읽기는 쿼리 시점 계산 없이 간단한 GET, COUNT, SCAN 연산을 사용합니다.
  context: paragraph
- source: See [Mutation](/design/mutation/) for how these are created. See [Query](/design/query/) for how to access them.
  target: 이러한 구조가 어떻게 만들어지는지는 [뮤테이션](/ko/design/mutation/)을 참조하세요. 접근 방법은 [쿼리](/ko/design/query/)를 참조하세요.
  context: paragraph
- source: Data Flow
  target: 데이터 흐름
  context: heading
- source: Write Path
  target: 쓰기 경로
  context: heading
- source: Write to WAL for durability
  target: 내구성을 위해 WAL에 쓰기
  context: list_item
- source: Acquire lock
  target: 락 획득
  context: list_item
- source: Compute indexes and counters
  target: 인덱스와 카운터를 계산합니다.
  context: list_item
- source: Write to storage
  target: 스토리지에 기록합니다.
  context: list_item
- source: Emit CDC for downstream systems
  target: 다운스트림 시스템을 위한 CDC를 발생시킵니다.
  context: list_item
- source: See [Mutation](/design/mutation/).
  target: '[뮤테이션](/ko/design/mutation/)을 참고하세요.'
  context: paragraph
- source: Read Path
  target: 읽기 경로
  context: heading
- source: See [Query](/design/query/).
  target: '[쿼리](/ko/design/query/)를 참고하세요.'
  context: paragraph
