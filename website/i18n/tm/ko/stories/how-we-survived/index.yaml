entries:
- source: How we earned trust in production
  target: 프로덕션에서 신뢰를 얻기까지
  context: frontmatter:description
- source: Actionbase was deployed to production before it was "complete." It had to keep evolving while maintaining production contracts.
  target: Actionbase는 "완성"되기 전에 프로덕션에 배포되었습니다. 프로덕션 계약을 지키면서 계속 발전해야 하는 상황이었습니다.
  context: paragraph
- source: Tests passed. But we couldn't confidently answer "is there really no problem?" We walked along [streams in Pangyo](https://github.com/kakao/actionbase/discussions/9) (Tancheon and Unjungcheon) discussing this concern. How could we build a state where even we could trust the system?
  target: 테스트는 통과했습니다. 하지만 "문제 없어?"라는 질문에 자신 있게 대답할 수 없었습니다. [판교 탄천과 운중천](https://github.com/kakao/actionbase/discussions/9)을 걸으며 이 고민을 많이 했습니다. 어떻게 하면 우리 스스로도 믿을 수 있는 상태를 만들 수 있을까.
  context: paragraph
- source: So we built verification layers.
  target: 그래서 검증 계층을 쌓았습니다.
  context: paragraph
- source: Verification Layers
  target: 검증 계층
  context: heading
- source: Stage | Method | Purpose
  target: 단계 | 검증 방법 | 목적
  context: table
- source: Each layer catches different types of problems. One layer isn't enough.
  target: 각 계층은 다른 종류의 문제를 잡습니다. 한 계층으로는 충분하지 않습니다.
  context: paragraph
- source: What We Gained
  target: 결국 얻은 것
  context: heading
- source: 'Through verification, we gained confidence: **even if issues occur, we can detect and correct them**.'
  target: '검증을 통해 확신이 생겼습니다: **문제가 발생해도 감지하고 보정할 수 있다**.'
  context: paragraph
- source: As this confidence accumulated, we could trust Actionbase even when it was the ledger itself. This wasn't a design decision made upfront. It was trust earned by building verification.
  target: 이 확신이 쌓이면서 Actionbase 자체가 원장인 경우에도 신뢰할 수 있게 되었습니다. 처음부터 내린 설계 결정이 아니었습니다. 검증을 쌓아서 얻은 신뢰였습니다.
  context: paragraph
- source: The goal isn't to prevent all failures. It's to detect and fix them before they matter.
  target: 목표는 모든 실패를 방지하는 것이 아닙니다. 문제가 되기 전에 감지하고 고치는 것입니다.
  context: paragraph
