entries:
- source: Pre-deployment verification by mirroring production traffic
  target: 프로덕션 트래픽을 미러링하여 배포 전 검증
  context: frontmatter:description
- source: 'This story demonstrates the **Shadow Testing** pattern: how to perform final verification before deployment by mirroring production traffic.'
  target: '이 스토리는 **Shadow Testing** 패턴을 보여줍니다: 프로덕션 트래픽을 미러링하여 배포 전 최종 검증하는 방법입니다.'
  context: paragraph
- source: Why We Needed This
  target: 왜 필요했나
  context: heading
- source: '[Tests as Contracts](/stories/how-we-survived/contracts/) passed. But there are areas tests can''t cover:'
  target: '[Tests as Contracts](/ko/stories/how-we-survived/contracts/)를 통과했습니다. 하지만 테스트가 커버하지 못하는 영역이 있습니다:'
  context: paragraph
- source: Bugs that only occur with specific data combinations
  target: 특정 데이터 조합에서만 발생하는 버그
  context: list_item
- source: Performance issues dependent on traffic patterns
  target: 트래픽 패턴에 따른 성능 문제
  context: list_item
- source: Issues that only surface at production data scale
  target: 프로덕션 데이터 규모에서만 드러나는 이슈
  context: list_item
- source: Clients using behaviors not specified in contracts
  target: Contract에 명시되지 않은 동작을 사용하는 클라이언트
  context: list_item
- source: These are conditions you can't create in test environments.
  target: 테스트 환경에서는 만들어낼 수 없는 조건들입니다.
  context: paragraph
- source: How It Works
  target: 동작 방식
  context: heading
- source: Nginx Ingress in front of production Actionbase logs all requests and responses as Access Logs. These logs go to Kafka, and the same requests are replayed to the test environment. Since it's log-based, there's no impact on live service traffic.
  target: 프로덕션 Actionbase 앞단의 Nginx Ingress가 모든 요청과 응답을 Access Log로 기록합니다. 이 로그를 Kafka로 보내고, 같은 요청을 테스트 환경에 재생합니다. 로그 기반이라 실제 서비스 트래픽에는 영향이 없습니다.
  context: paragraph
- source: '**Capture**: Nginx Ingress logs requests and responses to Kafka as Access Logs'
  target: '**Capture**: Nginx Ingress가 요청과 응답을 Access Log로 Kafka에 기록'
  context: list_item
- source: '**Replay**: Same requests replayed to test environment'
  target: '**Replay**: 같은 요청을 테스트 환경에 재생'
  context: list_item
- source: '**Compare**: Compare production response with test response'
  target: '**Compare**: 프로덕션 응답과 테스트 응답 비교'
  context: list_item
- source: '**Gate**: Block deployment on mismatch'
  target: '**Gate**: 불일치 시 배포 차단'
  context: list_item
- source: Deployment Process
  target: 배포 프로세스
  context: heading
- source: Both stages must pass before deployment proceeds.
  target: 두 단계를 모두 통과해야 배포가 진행됩니다.
  context: paragraph
- source: What We Learned
  target: 배운 점
  context: heading
- source: '**Real traffic is irreplaceable.** No matter how sophisticated test scenarios are, they can''t perfectly reproduce production traffic patterns.'
  target: '**실제 트래픽은 대체할 수 없다.** 아무리 정교한 테스트 시나리오도 프로덕션 트래픽 패턴을 완벽히 재현하지 못합니다.'
  context: list_item
- source: '**Final gate before deployment.** Both Tests as Contracts and Shadow Testing must pass before deployment.'
  target: '**배포 전 마지막 관문.** Tests as Contracts와 Shadow Testing을 모두 통과해야 배포할 수 있습니다.'
  context: list_item
