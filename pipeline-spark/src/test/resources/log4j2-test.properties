status = WARN
monitorInterval = 60

# ===================
# Appenders
# ===================
appender.console.type = Console
appender.console.name = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}][%t][%p][%logger{25}][%F/%M:%L] %m%n

# ===================
# Loggers
# ===================
logger.spark.name = org.apache.spark
logger.spark.level = warn
logger.spark.additivity = false
logger.spark.appenderRefs = console
logger.spark.appenderRef.console.ref = CONSOLE

logger.parquet.name = org.apache.parquet
logger.parquet.level = warn
logger.parquet.additivity = false
logger.parquet.appenderRefs = console
logger.parquet.appenderRef.console.ref = CONSOLE

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn
logger.hadoop.additivity = false
logger.hadoop.appenderRefs = console
logger.hadoop.appenderRef.console.ref = CONSOLE

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.jetty.additivity = false
logger.jetty.appenderRefs = console
logger.jetty.appenderRef.console.ref = CONSOLE

logger.hbase.name = org.apache.hadoop.hbase
logger.hbase.level = warn
logger.hbase.additivity = false
logger.hbase.appenderRefs = console
logger.hbase.appenderRef.console.ref = CONSOLE

logger.kctest.name = kc.test.client.v1
logger.kctest.level = info
logger.kctest.additivity = false
logger.kctest.appenderRefs = console
logger.kctest.appenderRef.console.ref = CONSOLE

# ===================
# Root Logger
# ===================
rootLogger.level = info
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = CONSOLE