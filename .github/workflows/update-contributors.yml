name: Update contributors
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Update cache buster
        run: |
          TODAY=$(date +%Y%m%d)
          sed -i "s/contrib.rocks\/image?repo=kakao\/actionbase[^)]*/contrib.rocks\/image?repo=kakao\/actionbase\&v=$TODAY/" README.md
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'docs: update contributors'
          title: 'docs: update contributors'
          body: 'Automated cache bust for contributors image.'
          branch: auto-update-contributors
          delete-branch: true
