name: Translation

on:
  push:
    branches: [ '**' ]
    paths:
      - 'website/src/content/docs/**'
      - '!website/src/content/docs/ko/**'
      - 'website/i18n/tm/**'
      - 'website/i18n/glossary/**'
      - '.github/workflows/translation.yml'

  pull_request:
    paths:
      - 'website/src/content/docs/**'
      - '!website/src/content/docs/ko/**'
      - 'website/i18n/tm/**'
      - 'website/i18n/glossary/**'
      - '.github/workflows/translation.yml'

  workflow_dispatch:

jobs:
  translate:
    strategy:
      matrix:
        lang: [ko]

    env:
      TARGET_LANG: ${{ matrix.lang }}

    name: Translate (${{ env.TARGET_LANG }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Detect trigger mode
        id: trigger
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build translations
        if: steps.trigger.outputs.build == 'true'
        run: python website/i18n/scripts/translation-memory.py --lang "$TARGET_LANG" build

      - name: Create translation PR
        if: steps.trigger.outputs.build == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: i18n/${{ env.TARGET_LANG }}/update-translations
          commit-message: 'docs(i18n): update ${{ env.TARGET_LANG }} translations'
          title: 'docs(i18n): update ${{ env.TARGET_LANG }} translations'
          body: |
            Automated ${{ env.TARGET_LANG }} translation update from TM-based pipeline.

            This PR was generated by the translation workflow.
          delete-branch: true

      - name: Validate translations
        if: steps.trigger.outputs.build == 'false'
        run: python website/i18n/scripts/translation-memory.py --lang "$TARGET_LANG" validate

      - name: Translation status (affected docs)
        if: steps.trigger.outputs.build == 'false'
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"

          # Glossary change → show all docs
          if git diff --name-only "origin/$BASE_REF"...HEAD -- "website/i18n/glossary/" | grep -q .; then
            python website/i18n/scripts/translation-memory.py --lang "$TARGET_LANG" status | tee /tmp/translation-status.txt
          else
            # Map changed TM paths to doc-relative paths
            DOCS=$(git diff --name-only "origin/$BASE_REF"...HEAD -- "website/i18n/tm/$TARGET_LANG/" \
              | sed "s|^website/i18n/tm/$TARGET_LANG/||;s|\.yaml$|.mdx|")
            if [ -n "$DOCS" ]; then
              python website/i18n/scripts/translation-memory.py --lang "$TARGET_LANG" status --docs $DOCS | tee /tmp/translation-status.txt
            else
              echo "No affected documents." | tee /tmp/translation-status.txt
            fi
          fi

          echo "## Translation Status ($TARGET_LANG)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/translation-status.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
