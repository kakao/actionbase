CI/CD:
  - changed-files:
    - any-glob-to-any-file:
      - .github/workflows/**
      - .github/labeler.yml

Build:
  - changed-files:
    - any-glob-to-any-file:
      - build.gradle.kts
      - '**/build.gradle.kts'
      - settings.gradle.kts
      - '**/settings.gradle.kts'
      - gradle.properties
      - gradle/**

Core:
  - changed-files:
    - any-glob-to-any-file:
      - codec-java/**
      - conventions/**
      - core/**
      - core-java/**

Engine:
  - changed-files:
    - any-glob-to-any-file:
      - engine/**

Platform:
  - changed-files:
    - any-glob-to-any-file:
      - platform/**

Server:
  - changed-files:
    - any-glob-to-any-file:
      - server/**

Website:
  - changed-files:
    - any-glob-to-any-file:
      - website/**

Documentation:
  - changed-files:
    - any-glob-to-any-file:
      - README.md
      - CONTRIBUTING.md
      - NOTICE.md
      - '**/*.md'

Test:
  - changed-files:
    - any-glob-to-any-file:
      - '**/src/test/**'
